    const i=notes.indexOf(target); let lick;
    if(dir>0 && i>=2) lick=[notes[i-2],notes[i-1],target]; else if(i+2<notes.length) lick=[notes[i+2],notes[i+1],target]; else lick=[notes[i-2],notes[i-1],target];
    const roots=notes.filter(n=>pc(n.s,n.f)===c.root); const rootN=roots.length?roots.reduce((a,b)=>Math.abs(b.p-target.p)<Math.abs(a.p-target.p)?b:a):target;
    lick.push(rootN);
    marks.push({at:ev.length,name:c.name});
    ev=ev.concat(lick.map((n,k)=>({s:n.s,f:n.f,ann:k===2?'3rd':k===3?'R':''})));
    dir=-dir;
  }
  let h=`<div class="routine" data-routine="mood"><div class="prog"><h3>Progressions by mood <small>${numerals} · in ${minorMode?NOTES[r]+' minor ('+NOTES[keyMaj]+' major)':NOTES[r]} · licks from the ${state.pos==='open'?'open position':state.shape+' shape'} pentatonic box, frets ${lo}–${hi}</small></h3>`;
  h+=`<div class="ctl" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${MOODS.map((m,j)=>`<button data-mood="${j}" class="${j===state.mood?'on':''}">${m[0]}</button>`).join('')}</div>`;
  h+=`<div class="chords">${tr.map((c,j)=>`<div class="cb">${chordBox(c.root,c.q)}<div class="nm">${c.name}</div><div class="fn">bar ${j+1}</div></div>`).join('')}</div>`;
  h+=`<div class="lick"><b>Lick</b> — one bar per chord: two pentatonic notes walking into the chord's 3rd on the downbeat, then its root. The direction alternates so the phrase rises into one chord and falls into the next.</div>`;
  h+=`<div class="tabwrap">${tabSvg(ev,marks)}</div>`;
  h+=`<p class="note">Strum each chord for a bar and play the lick over it, or play the lick in the gap before the change so it leads the ear into the next chord. Change the shape above to move the whole thing to another box; the mood list stays in the selected key.</p>${extra||''}</div></div>`;
  return h;
}


// ---------- shell voicings: root, 7th and 3rd on the bass strings, 5th dropped ----------
const TO7 = {major:'maj7',minor:'min7',dom7:'dom7',maj7:'maj7',min7:'min7',m7b5:'m7b5',dim7:'dim7'};
function shellsFor(cr,q){ const t=CHORD[TO7[q]]; const out=[];
  for(const [bs,ss,ts] of [[0,2,3],[1,3,4]]){
    for(let fr=0;fr<=12;fr++){ if((pc(bs,fr)-cr+12)%12!==0) continue;
      let f7=null,f3=null; for(let f=Math.max(0,fr-3);f<=fr+3;f++){ if(f7===null&&(pc(ss,f)-cr+12)%12===t[3]) f7=f; if(f3===null&&(pc(ts,f)-cr+12)%12===t[1]) f3=f; }
      if(f7===null||f3===null) continue;
      out.push({set:[bs,ss,ts],frets:[fr,f7,f3],min:Math.min(fr,f7,f3)}); break; } }
  return out; }
function shellBox(cr,q,v){ const saved={root:state.root,quality:state.quality}; state.root=cr; state.quality=TO7[q];
  const notes=v.set.map((st,k)=>({s:st,f:v.frets[k],i:iv(st,v.frets[k])})); const muted=new Set([0,1,2,3,4,5].filter(x=>!v.set.includes(x)));
  const lo=Math.max(0,v.min), out=box(lo,lo+3,notes,muted); state.root=saved.root; state.quality=saved.quality; return out; }
function shellsView(){
  const q=TO7[state.quality], vs=shellsFor(state.root,state.quality);
  let el=document.getElementById('shells'); if(!el){ el=document.createElement('div'); el.className='drop2'; el.id='shells'; document.getElementById('triads').after(el); }
  el.innerHTML=`<h2>Shell voicings <small>${NOTES[state.root]}${SUFFIX[q]} \u00b7 root, 7th and 3rd on the bass strings, the 5th left out \u2014 the comping shapes behind jazz and blues rhythm${state.quality==='major'||state.quality==='minor'?' \u00b7 shown as the 7th chord':''}</small></h2>
    <div class="row">${vs.map(v=>`<div class="triad">${shellBox(state.root,state.quality,v)}<div class="cap">${v.set.map(x=>NOTES[TUNING[x]]).join('')} strings \u00b7 R \u2013 7 \u2013 3</div></div>`).join('')}</div>`;
}
// ---------- one progression, three ways ----------
function triadsOn(cr,q,set){ const tones=CHORD[q].slice(0,3), out=[];
  for(let fa=0;fa<=15;fa++) for(let fb=Math.max(0,fa-3);fb<=fa+3;fb++) for(let fc=Math.max(0,fa-3);fc<=fa+3;fc++){
    const is=[pc(set[0],fa),pc(set[1],fb),pc(set[2],fc)].map(x=>(x-cr+12)%12);
    if(!is.every(x=>tones.includes(x))||new Set(is).size!==3) continue;
    if(Math.max(fa,fb,fc)-Math.min(fa,fb,fc)>3) continue;
    out.push({frets:[fa,fb,fc],bass:is[0],mean:(fa+fb+fc)/3}); }
  return out; }
function threeWaysView(chords,title){
  const {lo,hi}=placeShape(state.shape,'pent'); const target=(lo+hi)/2, set=[3,4,5];
  // triad row: pick inversions that move least from the previous chord, starting near the selected box; dominant chords use the dim triad on the 3rd
  let prev=target; const triRow=chords.map(c=>{
    let cr=c.root, q=c.q, label=c.name, sub='';
    if(q==='dom7'){ cr=(c.root+4)%12; q='dim7'; sub=`substitutes for ${c.name}: the dim triad on its 3rd is ${c.name} without the root`; }
    const opts=triadsOn(cr,q,set); if(!opts.length) return null;
    const best=opts.reduce((a,b)=>Math.abs(b.mean-prev)<Math.abs(a.mean-prev)?b:a); prev=best.mean;
    const t3=CHORD[q][1], t5=CHORD[q][2]; const bassName=NOTES[(cr+best.bass)%12], base=NOTES[cr]+(t5===6?'dim':t3===3?'m':'');
    const nm= best.bass===0?base:base+'/'+bassName;
    const saved={root:state.root,quality:state.quality}; state.root=cr; state.quality=q;
    const notes=set.map((st,k)=>({s:st,f:best.frets[k],i:iv(st,best.frets[k])})); const mn=Math.min(...best.frets);
    const svg=box(mn,mn+3,notes,new Set([0,1,2])); state.root=saved.root; state.quality=saved.quality;
    return {svg,nm,sub}; });
  const shellRow=chords.map(c=>{ const vs=shellsFor(c.root,c.q); if(!vs.length) return null; const v=vs.reduce((a,b)=>Math.abs(b.min-target)<Math.abs(a.min-target)?b:a); return {svg:shellBox(c.root,c.q,v),nm:NOTES[c.root]+SUFFIX[TO7[c.q]]}; });
  const row=(lbl,items)=>`<div class="tw-row"><div class="tw-lbl">${lbl}</div>${items.map(x=>x?`<div class="cb">${x.svg}<div class="nm">${x.nm}</div>${x.sub?`<div class="fn">${x.sub}</div>`:''}</div>`:'<div class="cb"></div>').join('')}</div>`;
  let h=`<div class="routine" data-routine="tw"><div class="prog"><h3>One progression, three ways <small>${title} \u00b7 the same chords as open or CAGED chords, as close-voiced triads on the top three strings, and as shell voicings</small></h3>`;
  h+=`<div class="ctl" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span class="lbl">Progression</span>${[['p1','I \u2013 IV \u2013 V'],['p2','6ths progression'],['p3','ii \u2013 V \u2013 I'],['blues','12-bar blues'],['mood','Current mood']].map(([id,nm])=>`<button data-tw="${id}" class="${state.twProg===id?'on':''}">${nm}</button>`).join('')}</div>`;
  h+=row('Chords',chords.map(c=>({svg:chordBox(c.root,c.q),nm:c.name})));
  h+=row('Triads',triRow);
  h+=row('Shells',shellRow);
  h+=`<p class="note">The triad row picks each chord's inversion so the hand moves as little as possible from the chord before, starting near the ${state.pos==='open'?'open position':state.shape+' shape'} box \u2014 that is voice leading, and it is why the row stays in one area of the neck. Slash names give the bass note. Shells drop the 5th and keep root, 7th and 3rd, so every chord's character sits in three notes. Play the progression each way in turn, then mix them.</p></div></div>`;
  return h;
}


// ---------- 12-bar blues riffs: shuffle boogie on each chord, and a turnaround ----------
function shuffleRiff(cr){ // root on the low E where it sits low enough, otherwise on the A string; 5–6–b7 on the string above
  let st=0, f=(cr-4+12)%12; if(f>7){ st=1; f=(cr-9+12)%12; }
  const up=st+1, cell=k=>({notes:[{s:st,f},{s:up,f:f+k}]});
  return [cell(2),cell(2),cell(4),cell(4),cell(2),cell(2),cell(4),cell(4)];   // one bar of shuffle eighths: 5 5 6 6 5 5 6 6 (index, ring, little finger)
}
function shuffleRiff7(cr){ // the b7 variation: only offered when the root sits high enough for the extra stretch
  let st=0, f=(cr-4+12)%12; if(f>7){ st=1; f=(cr-9+12)%12; }
  if(f<5) return null;
  const up=st+1, cell=k=>({notes:[{s:st,f},{s:up,f:f+k}]});
  return [cell(2),cell(2),cell(4),cell(4),cell(5),cell(5),cell(4),cell(4)];
}
function turnaround(cr){ // root held on a bass string, chromatic walk-down two strings up from the octave: R – 7 – b7 – 6, then the V chord
  let ps=1, pf=(cr-9+12)%12, ws=3, wf=pf+2;               // A-string root, walk-down on the G string
  if(pf<3){ ps=0; pf=(cr-4+12)%12; ws=2; wf=pf+2; }        // low roots: E-string root, walk-down on the D string
  return [0,1,2,3].map(k=>({notes:[{s:ps,f:pf},{s:ws,f:wf-k}]}));
}

// ---------- 12-bar blues study: one continuous chorus generated in a CAGED box ----------
const BLUES_VARS=4;
const bluesNum=(v,root,shape)=>((v*12+root)*5+Math.max(0,POP_SHAPES.indexOf(shape)))+1;
const bluesFromNum=n=>{ n=Math.min(12*5*BLUES_VARS,Math.max(1,Math.round(n)))-1; const shape=POP_SHAPES[n%5]; n=Math.floor(n/5); return {root:n%12,v:Math.floor(n/12),shape}; };
function bluesStudy(shape, chords, v){ v=v||0;
  const [I,IV,V]=chords, saved=state.shape, savedQ=state.quality; state.shape=shape; state.quality='minor';   // the minor-pentatonic box
  const r=state.root, {lo,hi}=placeShape(shape,'pent'); state.shape=saved; state.quality=savedQ;
  const blues=[0,3,5,6,7,10];
  // two pools: every note in the window (for chord-tone targets) and the blues scale plus the major 3rd and 6th (for runs and double-stops)
  const all=[]; for(let s=0;s<6;s++) for(let f=Math.max(0,lo-1);f<=hi+1;f++){ const i=(pc(s,f)-r+12)%12; all.push({s,f,i,p:BASE[s]+f}); }
  const minor=MINORISH.includes(savedQ); const pool=all.filter(n=>blues.includes(n.i)||(!minor&&(n.i===4||n.i===9)));
  // one note per pitch: prefer the note inside the box, then the one nearest the box centre, then the higher string
  const ctr=(lo+hi)/2, rank=n=>((n.f<lo||n.f>hi)?100:0)+Math.abs(n.f-ctr)-n.s*0.01;
  for(const L of [all,pool]){ L.sort((a,b)=>a.p-b.p||rank(a)-rank(b)); for(let k=L.length-1;k>0;k--) if(L[k].p===L[k-1].p) L.splice(k,1); }
  const P=n=>BASE[n.s]+n.f, R={rest:true};
  // turnaround near the box: root held on the E or A string, chromatic walk-down two strings up (R – 7 – b7 – 6)
  const turn=()=>{ const cands=[]; for(const [ps,ws] of [[1,3],[0,2]]){ let pf=(r-TUNING[ps]+12)%12; for(const f of [pf,pf+12]){ const wf=f+2; if(wf-3>=0&&f<=15) cands.push({ps,ws,pf:f,wf,d:Math.abs(f-ctr)}); } }
    if(!cands.length) return []; const c=cands.reduce((a,b)=>b.d<a.d?b:a); return [0,1,2,3].map(k=>({notes:[{s:c.ps,f:c.pf},{s:c.ws,f:c.wf-k}]})); };
  const near=(list,p)=>list.length?list.reduce((a,b)=>Math.abs(P(b)-p)<Math.abs(P(a)-p)?b:a):null;
  const civ=(c,n)=>(pc(n.s,n.f)-c.root+12)%12;
  const tone=(c,iv,p,filter)=>near(all.filter(n=>civ(c,n)===iv&&(!filter||filter(n))),p);
  const N=(n,ann)=>n?{s:n.s,f:n.f,ann:ann||''}:R;
  const topP=P(pool[pool.length-1]), midP=(P(pool[0])+topP)/2, hiP=topP-3;
  const T3=c=>CHORD[c.q][1], T7=c=>CHORD[c.q][3]??10;
  const stab=c=>{ const min=c.q==='min7'; const cr=min?c.root:(c.root+4)%12, q=min?'minor':'dim7'; const opts=[[2,3,4],[3,4,5]].flatMap(set=>triadsOn(cr,q,set).map(o=>({...o,set}))); if(!opts.length) return R;
    const best=opts.reduce((a,b)=>Math.abs(b.mean-(lo+hi)/2)<Math.abs(a.mean-(lo+hi)/2)?b:a); return {notes:best.set.map((s,k)=>({s,f:best.frets[k]})),ann:'stab'}; };
  const bar=(...ev)=>{ const a=ev.flat().filter(Boolean); while(a.length<8) a.push(R); return a.slice(0,8); };
  const slideIn=(c,iv,p)=>{ const t=tone(c,iv,p); if(!t) return []; if(t.f<2) return [N(t)]; return [{s:t.s,f:t.f-2,ann:'sl.'},N(t)]; };
  const vib=n=>N(n,'~~~');
  const hammer=(c,fromIv,toIv,p)=>{ const to=tone(c,toIv,p); if(!to) return []; const from=pool.find(n=>n.s===to.s&&n.f<to.f&&civ(c,n)===fromIv); return from?[N(from),N(to,'H')]:[N(to)]; };
  const dyads=(count,dir)=>{ const out=[]; for(const e of pool.filter(n=>n.s===5)) for(const b of pool.filter(n=>n.s===4)){ const d=P(e)-P(b); if(d>=3&&d<=6&&Math.abs(e.f-b.f)<=1) out.push({notes:[{s:4,f:b.f},{s:5,f:e.f}],p:P(e)}); }
    out.sort((a,b)=>a.p-b.p); const uniq=out.filter((x,k)=>k===0||x.p!==out[k-1].p); const pick=dir>0?uniq.slice(0,count):uniq.slice(-count).reverse(); return pick.map(x=>({notes:x.notes})); };
  const bend=c=>{ const rt=tone(c,0,hiP); if(!rt) return []; const n4=tone(c,5,P(rt)-2,n=>P(n)<P(rt)); const b3=tone(c,3,P(rt)-1,n=>P(n)>P(rt)-4&&P(n)<=P(rt)+3); return [N(n4,'bend'),N(n4,'rel.'),N(b3),vib(rt)].filter(x=>!x.rest); };
  const runInto=(c,iv,count,dir,ann)=>{ const t=tone(c,iv,midP+2); if(!t) return []; const seq=dir>0?pool.filter(n=>P(n)<P(t)).slice(-(count-1)):pool.filter(n=>P(n)>P(t)).slice(0,count-1).reverse(); return seq.map(n=>N(n)).concat([N(t,ann===undefined?'\u2192 '+c.name:ann)]); };
  const chrom=c=>{ const t=tone(c,0,midP); if(!t||t.f<2) return []; return [{s:t.s,f:t.f-2,ann:''},{s:t.s,f:t.f-1,ann:''},N(t,'\u2192 '+c.name)]; };
  const rhythm=(c,n)=>{ const rt=tone(c,0,hiP); return rt?[...Array(n)].map((_,k)=>N(rt,k%2===0?'>':'')):[]; };
  const withVib=x=>{ if(x.length) x[x.length-1].ann='~~~'; return x; };
  const opts=[
    [ ()=>bar(stab(I),R,slideIn(I,0,hiP),hammer(I,T3(I)-1,T3(I),hiP),vib(tone(I,7,hiP))),    // 1
      ()=>bar(stab(I),R,slideIn(I,0,hiP),withVib(runInto(I,7,3,1,''))),
      ()=>bar(rhythm(I,3),R,hammer(I,T3(I)-1,T3(I),hiP),vib(tone(I,7,hiP))) ],
    [ ()=>bar(stab(I),R,runInto(I,0,4,-1,'R')),                                              // 2
      ()=>bar(stab(I),R,bend(I)),
      ()=>bar(dyads(3,1),R,vib(tone(I,0,hiP))) ],
    [ ()=>bar(dyads(4,1),R,R,slideIn(I,T7(I),hiP)),                                          // 3
      ()=>bar(rhythm(I,4),R,runInto(I,3,3,-1,'b3')),
      ()=>bar(withVib(runInto(I,T7(I),4,1,'')),R,R,slideIn(I,0,hiP)) ],
    [ ()=>bar(bend(I),R,runInto(IV,T3(IV),3,1)),                                             // 4
      ()=>bar(runInto(I,0,4,-1,'R'),R,chrom(IV)),
      ()=>bar(dyads(3,-1),R,runInto(IV,T3(IV),3,1)) ],
    [ ()=>bar(stab(IV),R,slideIn(IV,T3(IV),hiP),N(tone(IV,7,hiP)),vib(tone(IV,T7(IV),hiP))),  // 5
      ()=>bar(stab(IV),R,bend(IV)),
      ()=>bar(stab(IV),R,dyads(4,1),vib(tone(IV,0,hiP))) ],
    [ ()=>bar(dyads(4,-1),R,runInto(I,3,3,-1)),                                              // 6
      ()=>bar(runInto(IV,T7(IV),4,1,''),R,slideIn(I,0,hiP)),
      ()=>bar(rhythm(IV,4),R,runInto(I,0,3,-1)) ],
    [ ()=>bar(stab(I),R,withVib(runInto(I,0,4,-1,''))),                                      // 7
      ()=>bar(stab(I),R,slideIn(I,T3(I),hiP),vib(tone(I,0,hiP))),
      ()=>bar(stab(I),R,bend(I)) ],
    [ ()=>bar(rhythm(I,4),R,chrom(V)),                                                       // 8
      ()=>bar(runInto(I,0,4,-1,'R'),R,chrom(V)),
      ()=>bar(dyads(3,1),R,R,chrom(V)) ],
    [ ()=>bar(stab(V),R,slideIn(V,T3(V),hiP),N(tone(V,7,hiP)),vib(tone(V,0,hiP))),          // 9
      ()=>bar(stab(V),R,bend(V)),
      ()=>bar(stab(V),R,withVib(runInto(V,T3(V),4,-1,''))) ],
    [ ()=>bar(stab(IV),R,bend(IV)),                                                          // 10
      ()=>bar(stab(IV),R,slideIn(IV,T3(IV),hiP),dyads(2,-1),vib(tone(IV,0,hiP))),
      ()=>bar(stab(IV),R,withVib(runInto(IV,T7(IV),4,1,''))) ],
    [ ()=>bar(dyads(3,-1),R,runInto(I,0,3,-1,'~~~')),                                        // 11
      ()=>bar(runInto(I,0,6,-1,'~~~')),
      ()=>bar(bend(I),R,runInto(I,0,2,-1,'~~~')) ],
    [ ()=>bar(turn(),R,R,stab(V),R) ],                                                       // 12 the turnaround is fixed
  ];
  const pickIdx=(b)=>(Math.floor(Math.abs(Math.sin(v*13.7+b*7.3))*1000))%3;   // deterministic per variation and bar
  const bars=opts.map((o,b)=>o[pickIdx(b)%o.length]());
  const names=[I,I,I,I,IV,IV,I,I,V,IV,I,I].map(c=>c.name);
  // two bars per line so the tab renders at roughly double the size of a four-bar line
  const lines=[0,2,4,6,8,10].map(b0=>{ const ev=bars.slice(b0,b0+2).flat(); const marks=[0,1].map(k=>({at:k*8,name:(b0+k+1)+' \u00b7 '+names[b0+k]})); return tabSvg(ev,marks); });
  return {lines,lo,hi};
}

// ---------- 12-bar boogie study: bass boogie underneath, chord backbeats and licks on top ----------
function boogieStudy(shape, chords, v, open){
  v=v||0; const [I,IV,V]=chords, r=state.root, minor=MINORISH.includes(state.quality);
  const saved=state.shape, savedQ=state.quality; state.shape=shape; state.quality='minor'; const {lo,hi}=placeShape(shape,'pent'); state.shape=saved; state.quality=savedQ;
  const ctr=(lo+hi)/2, R={rest:true}, blues=[0,3,5,6,7,10];
  const civ=(c,s,f)=>(pc(s,f)-c.root+12)%12, T3=c=>CHORD[c.q][1], T7=c=>CHORD[c.q][3]??10;
  // where each chord's bass sits: root on the E, A (or D, open mode) string, with the moving string above it
  const rootPos=c=>{ const cands=[]; const maxS=open?2:1; for(let bs=0;bs<=maxS;bs++){ const f0=(c.root-TUNING[bs]+12)%12; for(const f of [f0,f0+12]){ if(f+5>17) continue; cands.push({bs,f,score:open?f*10+bs:Math.abs(f+2.5-ctr)*10+bs}); } }
    return cands.reduce((a,b)=>b.score<a.score?b:a); };
  const pos={}; for(const c of [I,IV,V]) pos[c.name]=rootPos(c);
  // bass: the root and the moving note (5, 6, b7 on the string above) alternate, never together — thumb on the root, then the moving note:
  // R 5 R 5 R 6 R 6, so beats 2 and 4 (where the chord fragments land) are always on the root, never on the stretched 6 or b7
  const bassCell=(c,k)=>{ const p=pos[c.name]; return k===null?{notes:[{s:p.bs,f:p.f}]}:{notes:[{s:p.bs+1,f:p.f+k,stretch:k>=4}]}; };
  const boogie=(c,seven)=>(seven?[null,2,null,4,null,5,null,5]:[null,2,null,2,null,4,null,4]).map(k=>bassCell(c,k));
  const bassOnly=(c,k)=>({notes:[{s:pos[c.name].bs,f:pos[c.name].f+k}]});
  const walkUp=c=>[0,0,2,2,3,3,4,4].map(k=>bassOnly(c,k));                 // R, 2, b3, 3 → the IV root is the next fret
  const walkToV=c=>[0,0,4,4,5,5,6,6].map(k=>bassOnly(c,k));                // R, 3, 4, b5 → the V root is the next fret
  // treble: the chord's top three strings from the CAGED shape that matches the bass position
  const frag=c=>{ const p=pos[c.name], shape=['E','A','D'][p.bs], offs=SHAPES[shape][c.q]||SHAPES[shape].dom7; if(offs[p.bs]===null) return null; const cand=p.f-offs[p.bs];
    const notes=[3,4,5].filter(s=>offs[s]!==null).map(s=>({s,f:offs[s]+cand})); if(notes.some(n=>n.f<0||n.f>17)||notes.length<2) return null; return notes; };
  const fragEv=c=>{ const f=frag(c); return f?{notes:f}:R; };
  const win=c=>{ const f=frag(c); if(!f) return [Math.max(0,pos[c.name].f-1),pos[c.name].f+5]; const fr=f.map(n=>n.f); return [Math.max(0,Math.min(...fr)-2),Math.max(...fr)+3]; };
  const tnotes=(c,filter)=>{ const [a,b]=win(c), out=[]; for(let s=3;s<=5;s++) for(let f=a;f<=b;f++){ const i=civ(c,s,f); if(filter(i)) out.push({s,f,i,p:BASE[s]+f}); } return out.sort((x,y)=>x.p-y.p); };
  const N=(n,ann)=>n?{s:n.s,f:n.f,ann:ann||''}:R;
  // treble licks (events without bass; merged over the bass below)
  const hammer=c=>{ const t=tnotes(c,i=>i===T3(c)).sort((x,y)=>y.p-x.p)[0]; if(!t||t.f<1) return []; return [{s:t.s,f:t.f-1},{s:t.s,f:t.f,ann:'H'}]; };
  const dsSlide=c=>{ const f=frag(c); if(!f) return []; const a=f.find(n=>n.s===4), b=f.find(n=>n.s===5); if(!a||!b||a.f<2||b.f<2) return []; return [{notes:[{s:4,f:a.f-2},{s:5,f:b.f-2}],ann:'sl.'},{notes:[{s:4,f:a.f},{s:5,f:b.f}]}]; };
  const pullRun=c=>{ const f=frag(c); if(!f) return []; const out=[]; for(const s of [5,4]){ const top=f.find(n=>n.s===s); if(!top) continue; const low=tnotes(c,i=>CHORD[c.q].includes(i)||blues.includes((pc(s,0)+0-r+12)%12)).filter(n=>n.s===s&&n.f<top.f).sort((x,y)=>y.f-x.f)[0]; out.push({s,f:top.f}); if(low) out.push({s,f:low.f,ann:'P'}); } return out.slice(0,4); };
  const scaleRun=(from,to,count)=>{ const [a,b]=win(from); const pool=[]; for(let s=2;s<=5;s++) for(let f=a;f<=b+1;f++) if(blues.includes((pc(s,f)-r+12)%12)||(!minor&&(pc(s,f)-r+12)%12===4)) pool.push({s,f,p:BASE[s]+f});
    pool.sort((x,y)=>x.p-y.p||y.s-x.s); for(let k=pool.length-1;k>0;k--) if(pool[k].p===pool[k-1].p) pool.splice(k,1);
    const tgt=pool.filter(n=>civ(to,n.s,n.f)===0).sort((x,y)=>y.p-x.p)[0]; if(!tgt) return [];
    const above=pool.filter(n=>n.p>tgt.p).slice(0,count-1).reverse(); const below=pool.filter(n=>n.p<tgt.p).slice(-(count-1));
    const seq=(above.length>=count-1?above:below); return seq.map(n=>N(n)).concat([N(tgt,'\u2192 '+to.name)]); };
  const vib=c=>{ const t=tnotes(c,i=>i===0).sort((x,y)=>y.p-x.p)[0]; return t?[N(t,'~~~')]:[]; };
  // merge a treble line onto a bass line at a slot
  const merge=(bass,treble,at)=>{ const out=bass.map(e=>e.rest?{notes:[]}:{notes:[...e.notes],ann:e.ann||''}); treble.forEach((t,k)=>{ const j=at+k; if(j>=out.length) return; const tn=t.notes||[t]; if(!tn.length) return;
      const used=new Set(tn.map(n=>n.s)); out[j].notes=out[j].notes.filter(n=>!n.stretch&&!used.has(n.s));   // a lick over the stretched 6 / b7 is unreachable (the thumb rests), and a string can only sound one note
      out[j].notes=out[j].notes.concat(tn.map(n=>({s:n.s,f:n.f}))); if(t.ann) out[j].ann=t.ann; }); return out.map(e=>e.notes.length?e:R); };
  const backbeat=(bass,c)=>merge(bass,[fragEv(c)],2).map((e,j)=>j===6?merge([e],[fragEv(c)],0)[0]:e);
  const pm=ev=>{ ev[0].ann=(ev[0].ann?ev[0].ann+' ':'')+'P.M.'; return ev; };
  const pad=a=>{ a=a.slice(0,8); while(a.length<8) a.push(R); return a; };
  const pick=b=>(Math.floor(Math.abs(Math.sin(v*13.7+b*7.3))*1000))%3;
  // bar builders: each returns 8 events
  const groove=(c,b)=>{ const k=pick(b); const bass=boogie(c,k===2); if(k===0) return pm(backbeat(bass,c)); if(k===1) return pm(merge(backbeat(bass,c),hammer(c),4)); return pm(merge(backbeat(bass,c),dsSlide(c),4)); };
  const lickBar=(c,b,next)=>{ const k=pick(b); const bass=boogie(c,false); if(k===0) return pm(merge(bass,pullRun(c),4)); if(k===1) return pm(merge(bass,scaleRun(c,next||c,4),4)); return pm(merge(bass,[...dsSlide(c),...vib(c)],4)); };
  const bars=[
    groove(I,1), groove(I,2), lickBar(I,3), pad(merge(walkUp(I),[fragEv(I),R,...hammer(I)],2)).map((e,j)=>j===0?{...e,ann:'walk up'}:e),
    groove(IV,5), lickBar(IV,6,I), groove(I,7), pad(merge(walkToV(I),[...dsSlide(I),...pullRun(I)],2)).map((e,j)=>j===0?{...e,ann:'walk to V'}:e),
    groove(V,9), groove(IV,10), lickBar(I,11,I), pad(merge(bluesTurn(r,ctr,open),[fragEv(V)],6)).map((e,j)=>j===0?{...e,ann:'turnaround'}:j===6?{...e,ann:V.name}:e),
  ];
  const names=[I,I,I,I,IV,IV,I,I,V,IV,I,I].map(c=>c.name);
  const lines=[0,2,4,6,8,10].map(b0=>{ const ev=bars.slice(b0,b0+2).flat(); const marks=[0,1].map(k=>({at:k*8,name:(b0+k+1)+' \u00b7 '+names[b0+k]})); return tabSvg(ev,marks); });
  return {lines,lo,hi,pos};
}
function bluesTurn(r,ctr,open){ const cands=[]; for(const [ps,ws] of [[1,3],[0,2]]){ const pf=(r-TUNING[ps]+12)%12; for(const f of [pf,pf+12]){ const wf=f+2; if(wf-3>=0&&f<=15) cands.push({ps,ws,pf:f,wf,d:open?f:Math.abs(f-ctr)}); } }
  if(!cands.length) return []; const c=cands.reduce((a,b)=>b.d<a.d?b:a); return [0,0,1,1,2,2,3,3].map(k=>({notes:[{s:c.ps,f:c.pf},{s:c.ws,f:c.wf-k}]})); }

// ---------- 12-bar blues study: chord hit, then a lick, with chromatic 6ths at the phrase ends ----------
function simpleBlues(shape, chords, v){
  v=v||0; const [I,IV,V]=chords, r=state.root, minor=MINORISH.includes(state.quality);
  const saved=state.shape, savedQ=state.quality; state.shape=shape; state.quality='minor'; const {lo,hi}=placeShape(shape,'pent'); state.shape=saved; state.quality=savedQ;
  const ctr=(lo+hi)/2, R={rest:true}, blues=[0,3,5,6,7,10];
  const P=n=>BASE[n.s]+n.f, civ=(c,n)=>(pc(n.s,n.f)-c.root+12)%12, T3=c=>CHORD[c.q][1], T7=c=>CHORD[c.q][3]??10;
  // notes in and just around the box: the blues scale (plus the major 3rd and 6th in a major blues) for runs; every note for chord-tone targets
  const all=[]; for(let s=0;s<6;s++) for(let f=Math.max(0,lo-1);f<=hi+1;f++){ const i=(pc(s,f)-r+12)%12; all.push({s,f,i,p:BASE[s]+f}); }
  const rank=n=>((n.f<lo||n.f>hi)?100:0)+Math.abs(n.f-ctr)-n.s*0.01;
  const pool=all.filter(n=>blues.includes(n.i)||(!minor&&(n.i===4||n.i===9)));
  for(const L of [all,pool]){ L.sort((a,b)=>a.p-b.p||rank(a)-rank(b)); for(let k=L.length-1;k>0;k--) if(L[k].p===L[k-1].p) L.splice(k,1); }
  const near=(list,p)=>list.length?list.reduce((a,b)=>Math.abs(P(b)-p)<Math.abs(P(a)-p)?b:a):null;
  const tone=(c,iv,p,filter)=>near(all.filter(n=>civ(c,n)===iv&&(!filter||filter(n))),p);
  const N=(n,ann)=>n?{s:n.s,f:n.f,ann:ann||''}:R;
  const topP=P(pool[pool.length-1]), midP=(P(pool[0])+topP)/2, hiP=topP-3;
  // the chord hit: its plain triad on the top three strings, nearest the box
  const hit=c=>{ const q=c.q==='min7'||c.q==='minor'?'minor':'major'; const opts=[[3,4,5],[2,3,4]].flatMap(set=>triadsOn(c.root,q,set).map(o=>({...o,set}))); if(!opts.length) return R;
    const best=opts.reduce((a,b)=>Math.abs(b.mean-ctr)+(b.set[0]===3?0:0.5)<Math.abs(a.mean-ctr)+(a.set[0]===3?0:0.5)?b:a); return {notes:best.set.map((s,k)=>({s,f:best.frets[k]})),ann:c.name}; };
  // 6ths: lower note on the G string, upper on the high E (or D and B) — the chord's 3rd under its root, or its 5th under its 3rd
  const sixth=(c,which,minF)=>{ const [loI,upI]=which===0?[T3(c),0]:[7,T3(c)]; const out=[]; for(const [ls,us] of [[3,5],[2,4]]) for(let f=minF;f<=17;f++) if(((pc(ls,f)-c.root+12)%12)===loI) for(let g=Math.max(minF,f-3);g<=f+3;g++) if(((pc(us,g)-c.root+12)%12)===upI) out.push({ls,us,f,g,p:BASE[us]+g,d:Math.abs(f-ctr)+(ls===3?0:0.5)});
    if(!out.length) return null; return out.reduce((a,b)=>b.d<a.d?b:a); };
  const dy=(x,k,ann)=>({notes:[{s:x.ls,f:x.f-k},{s:x.us,f:x.g-k}],ann:ann||''});
  const sixthsInto=c=>{ const t=sixth(c,0,2); if(!t) return []; return [dy(t,2,'6ths'),dy(t,1,''),dy(t,0,'\u2192 '+c.name)]; };   // chromatic, up two frets into the chord
  const sixthsTurn=()=>{ const t=sixth(I,0,3); if(!t) return []; return [dy(t,0,'6ths'),R,dy(t,1,''),R,dy(t,2,''),R,dy(t,3,'')]; };  // walking down from the I into the V
  // licks: single-line, from the box
  const runInto=(c,iv,count,dir,ann)=>{ const t=tone(c,iv,midP+2); if(!t) return []; const seq=dir>0?pool.filter(n=>P(n)<P(t)).slice(-(count-1)):pool.filter(n=>P(n)>P(t)).slice(0,count-1).reverse(); return seq.map(n=>N(n)).concat([N(t,ann===undefined?'\u2192 '+c.name:ann)]); };
  const bend=c=>{ const rt=tone(c,0,hiP); if(!rt) return []; const n4=tone(c,5,P(rt)-2,n=>P(n)<P(rt)); const b3=tone(c,3,P(rt)-1,n=>P(n)>P(rt)-4&&P(n)<=P(rt)+3); return [N(n4,'bend'),N(n4,'rel.'),N(b3),N(rt,'~~~')].filter(x=>!x.rest); };
  const pulls=c=>{ const out=[]; for(const st of [5,4,3]){ const on=pool.filter(n=>n.s===st).sort((a,b)=>b.f-a.f); if(on.length>=2) out.push(N(on[0]),N(on[1],'P')); if(out.length>=4) break; } const rt=tone(c,0,P(out[out.length-1]||{s:0,f:0})-2,n=>out.length&&P(n)<P(out[out.length-1])); if(rt) out.push(N(rt,'~~~')); return out.slice(0,6); };
  const hammer=c=>{ const t=tone(c,T3(c),hiP); if(!t||t.f<1) return []; const f5=tone(c,7,P(t)+2,n=>P(n)>P(t)); return [{s:t.s,f:t.f-1,ann:''},{s:t.s,f:t.f,ann:'H'},N(f5),N(tone(c,0,P(t)-3,n=>P(n)<P(t)),'~~~')].filter(x=>!x.rest); };
  // double-stops: both notes from the minor pentatonic (3rds and 4ths only), or both chord tones of the chord being played
  const dstops=c=>{ const pent=[0,3,5,7,10], ct=CHORD[c.q]; const ok=(e,b)=>(pent.includes(e.i)&&pent.includes(b.i))||(ct.includes(civ(c,e))&&ct.includes(civ(c,b)));
    const out=[]; for(const e of pool.filter(n=>n.s===5)) for(const b of pool.filter(n=>n.s===4)){ const d=P(e)-P(b); if(d>=3&&d<=5&&Math.abs(e.f-b.f)<=2&&ok(e,b)) out.push({notes:[{s:4,f:b.f},{s:5,f:e.f}],p:P(e)}); }
    out.sort((a,b)=>a.p-b.p); const u=out.filter((x,k)=>k===0||x.p!==out[k-1].p); const two=u.slice(-2); if(two.length<2) return []; return [{notes:two[1].notes},{notes:two[0].notes},{notes:two[1].notes,ann:'~~~'}]; };
  const rhythm=c=>{ const rt=tone(c,0,hiP); if(!rt) return []; const b3=tone(c,3,P(rt)+3,n=>P(n)>P(rt)); return [N(rt,'>'),N(rt),N(rt,'>'),N(b3),N(rt,'~~~')].filter(x=>!x.rest); };
  const licks=[c=>runInto(c,0,4,-1,'R'),bend,pulls,hammer,dstops,rhythm,c=>runInto(c,T7(c),4,1,'b7')];
  const pick=b=>(Math.floor(Math.abs(Math.sin(v*13.7+b*7.3))*1000))%licks.length;
  const pad=a=>{ a=a.slice(0,8); while(a.length<8) a.push(R); return a; };
  const bar=(c,b,extra)=>{ const l=licks[pick(b)](c); const room=8-2-(extra?extra.length:0); return pad([hit(c),R,...l.slice(0,room),...(extra||[])]); };
  const bars=[ bar(I,1), bar(I,2), bar(I,3), bar(I,4,sixthsInto(IV)),
               bar(IV,5), bar(IV,6), bar(I,7), bar(I,8,sixthsInto(V)),
               bar(V,9), bar(IV,10), bar(I,11), pad([...sixthsTurn(),hit(V)]) ];
  const names=[I,I,I,I,IV,IV,I,I,V,IV,I,I].map(c=>c.name);
  const lines=[0,2,4,6,8,10].map(b0=>{ const ev=bars.slice(b0,b0+2).flat(); const marks=[0,1].map(k=>({at:k*8,name:(b0+k+1)+' \u00b7 '+names[b0+k]})); return tabSvg(ev,marks); });
  return {lines,lo,hi};
}

  Object.assign(state,saved);
  const N=i=>NOTES[(mr+i)%12], name=(i,suf)=>N(i)+suf;
  const cyc=[{root:mr,t:[0,3,7],name:name(0,'m'),fn:'1m'},{root:(mr+10)%12,t:[0,4,7],name:name(10,''),fn:'b7'},{root:(mr+8)%12,t:[0,4,7],name:name(8,''),fn:'b6'},{root:(mr+7)%12,t:[0,3,7],name:name(7,'m'),fn:'5m'},
             {root:(mr+5)%12,t:[0,3,7],name:name(5,'m'),fn:'4m'},{root:(mr+3)%12,t:[0,4,7],name:name(3,''),fn:'b3'},{root:(mr+2)%12,t:[0,3,6],name:name(2,'\u00b0'),fn:'2\u00b0'},{root:(mr+7)%12,t:[0,4,7,10],name:name(7,'7'),fn:'5',V:true}];

  const nat=SCALE.minor.map(i=>(mr+i)%12), harm=[0,2,3,5,7,8,11].map(i=>(mr+i)%12);

// ---------- 1–4–5 in every position: the three chords that live in one box, then chord-tone phrases that follow the changes there ----------

      <div class="formula">${sc}</div></div>`;
  // navigation card: step through the five shapes without going back to the tabs; from open position, "next" loads the same chord as its movable CAGED shape
  { const idx=ORDER.indexOf(state.shape), open=state.pos==='open', nextSh=open?state.shape:ORDER[(idx+1)%ORDER.length], prevSh=ORDER[(idx+ORDER.length-1)%ORDER.length];
    cards += `<div class="card" style="display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center">
      <h2 style="margin:0">Move on <small>${open?'from the open chord to its CAGED shape':'through the five shapes in neck order'}</small></h2>
      <button data-shapenav="next" style="font-size:16px;font-weight:700;padding:10px 18px">${open?'Take '+NOTES[state.root]+SUFFIX[q]+' up the neck: '+state.shape+' shape \u2192':'Next shape: '+nextSh+' \u2192'}</button>
      ${open?'':`<button data-shapenav="prev">\u2190 Previous: ${prevSh}</button>`}
      <small style="color:var(--muted)">${open?'same chord, same key, as a movable shape':'order '+ORDER.join(' \u2192 ')+'; after '+ORDER[ORDER.length-1]+' it wraps to '+ORDER[0]}</small></div>`; }
  document.getElementById('grid').innerHTML = cards;
  document.querySelectorAll('#grid [data-shapenav]').forEach(b=>b.addEventListener('click',()=>{ const idx=ORDER.indexOf(state.shape);
    if(state.pos==='open'){ state.pos='caged'; } else if(b.dataset.shapenav==='next'){ state.shape=ORDER[(idx+1)%ORDER.length]; } else { state.shape=ORDER[(idx+ORDER.length-1)%ORDER.length]; }
    render(); }));

  const tr = triadView(state.shape), ch4 = CHORD[state.quality], hasSeventh = ch4.length===4;
  // string coverage of each shape's full chord voicing, so the six-string shapes (E and G) stand out
  { const GEN={0:'R',1:'b2',2:'2',3:'b3',4:'3',5:'4',6:'b5',7:'5',8:'b6',9:'6',10:'b7',11:'7'};
    const chips=ORDER.map(n=>{ const offs=SHAPES[n][state.quality]; if(!offs) return ''; const ps=placeShape(n); const played=offs.map((o,st)=>o===null?null:{st,f:o+ps.r6}).filter(Boolean); const cnt=played.length;
      const ivs=played.map(x=>{ const i=(pc(x.st,x.f)-state.root+12)%12; return INTV[state.quality][i]??GEN[i]; }).join(' ');
      const full=cnt===6, on=n===state.shape;
      return `<button data-trishape="${n}" class="${on?'on':''}" style="${full&&!on?'border-color:var(--fifth);color:var(--fifth);':''}" title="${n} shape voicing, low to high: ${ivs}">${n} \u00b7 ${cnt} strings${full?' \u2605':''}<small style="display:block;font-size:9px;font-weight:400;letter-spacing:0;line-height:1;margin-top:2px">${ivs}</small></button>`; }).join('');
    var trPrefix = `<div class="ctl" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><span class="lbl">Strings per shape</span>${chips}<span class="lbl" style="margin-left:6px">\u2605 = the full six-string chord: only the E and G shapes put a chord tone on every string</span></div>`; }
  let trHtml = `<h2>Triads <small>close-voiced, within reach of this position${hasSeventh?' \u00b7 7th omitted \u2014 the underlying '+NOTES[state.root]+(ch4[2]===6?'\u00b0':ch4[1]===4?'':'m')+' triad':''}</small></h2>`+
    `<div class="row">${tr.map(x=>`<div class="triad">${x.svg}<div class="cap">${x.cap}</div></div>`).join('')}</div>`;
  if(hasSeventh){
    const up = ch4.slice(1), ur = (state.root+up[0])%12, d1 = up[1]-up[0], d2 = up[2]-up[0];
    const uq = (d1===4&&d2===7)?'':(d1===3&&d2===7)?'m':(d1===3&&d2===6)?'\u00b0':(d1===4&&d2===8)?'+':'?';
    const ut = triadView(state.shape, up);
    trHtml += `<h2 style="margin-top:14px">Upper triad <small>3\u20135\u20137 without the root \u2014 ${NOTES[ur]}${uq} over ${NOTES[state.root]}${SUFFIX[state.quality]}; let the bass supply the root</small></h2>`+
      `<div class="row">${ut.map(x=>`<div class="triad">${x.svg}<div class="cap">${x.cap}</div></div>`).join('')}</div>`;
  }
  document.getElementById('triads').innerHTML = (trPrefix||'')+trHtml;
  document.querySelectorAll('#triads [data-trishape]').forEach(b=>b.addEventListener('click',()=>{ state.shape=b.dataset.trishape; if(state.pos==='open') state.pos='caged'; render(); }));
  const d2 = drop2View(state.shape); let el=document.getElementById('drop2');
  if(d2.length){ if(!el){ el=document.createElement('div'); el.className='drop2'; el.id='drop2'; document.getElementById('triads').after(el); }
    el.innerHTML=`<h2>Four-note voicings <small>drop-2 style, one chord tone per string, within reach of this position</small></h2><div class="row">${d2.map(x=>`<div class="triad">${x.svg}<div class="cap">${x.cap}</div></div>`).join('')}</div>`;
  } else if(el) el.remove();
  shellsView();
  extView();
  slashView();
  numsysView();
  modesView();
  listenView();
  dyadsView();
  seqView();
  cowboyView();
  practiceView();
  sectionsView();
}

// ---------- controls ----------
const rootsEl=document.getElementById('roots');
NOTES_SHARP.forEach((n,i)=>{ const b=document.createElement('button'); b.innerHTML=`${n===NOTES_FLAT[i]?n:n+'/'+NOTES_FLAT[i]}<small>${NOTES_SHARP[(i+9)%12]}m</small>`; b.dataset.r=i; b.addEventListener('click',()=>{state.root=i;state.key=i;render();}); rootsEl.appendChild(b); });
document.querySelectorAll('#quality button').forEach(b=>b.addEventListener('click',()=>{state.quality=b.dataset.q;state.keyMode=MINORISH.includes(state.quality)?'minor':'major';render();}));
document.querySelectorAll('#labels button').forEach(b=>b.addEventListener('click',()=>{state.labels=b.dataset.l;render();}));
document.querySelectorAll('#pos button').forEach(b=>b.addEventListener('click',()=>{state.pos=b.dataset.p;render();}));
render();
</script>
</body>
</html>
