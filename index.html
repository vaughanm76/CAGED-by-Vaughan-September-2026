<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAGED reference</title>
<style>
  :root{
    --ink:#1B2A41; --paper:#FFFFFF; --panel:#F3F5F8; --line:#D6DBE3; --muted:#6B7480;
    --root:#D7263D; --third:#E89B0C; --fifth:#1B998B; --tone:#556270; --tonelight:#B9C1CB;
    --seventh:#7B5EA7; --wood:#E9E3D6; --fret:#9AA3AE; --string:#4E5A69;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
  button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
  button:focus-visible{outline:2px solid var(--fifth);outline-offset:2px}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-bottom:14px}
  h1{font-size:30px;font-weight:700;letter-spacing:.32em;margin:0}
  h1 span{letter-spacing:0;font-size:14px;font-weight:400;color:var(--muted);margin-left:8px}
  .group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .group .lbl{font-size:12px;color:var(--muted);margin-right:4px}
  .tabwrap{position:relative}
  .tabwrap .pb{position:absolute;right:6px;top:4px;z-index:2;font-size:13px;padding:3px 9px;border-radius:14px;opacity:.85}
  .tabwrap .pb.on{background:var(--fifth);border-color:var(--fifth);color:#fff}
  .roots button{min-width:40px;padding:4px 5px 3px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .roots button small{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:0}
  .roots button.on{background:var(--root);border-color:var(--root)}
  .roots button.on small{color:#fff;opacity:.85}
  .roots button.rel{box-shadow:0 0 0 2px var(--fifth) inset;border-color:var(--fifth)}
  .roots button.rel small{color:var(--fifth);font-weight:600}
  .neck{background:var(--panel);border-radius:10px;padding:12px 14px 6px;margin-bottom:18px;overflow-x:auto}
  .neck svg{display:block;width:100%;min-width:760px;height:auto}
  .band{cursor:pointer}
  .band rect{fill:var(--ink);opacity:.06;transition:opacity .15s}
  .band:hover rect{opacity:.14}
  .band.on rect{opacity:.22;fill:var(--fifth)}
  .band text{font-size:13px;font-weight:700;fill:var(--ink)}
  .band.on text{fill:var(--fifth)}
  .sections{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px;padding:6px 0;position:sticky;top:0;background:var(--paper);z-index:5;border-bottom:1px solid var(--line)}
  .sections button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 12px;font-weight:600;color:var(--muted)}
  .sections button.on{color:var(--ink);border-bottom-color:var(--root);background:none}
  .sec-hidden{display:none!important}
  .sections .necktoggle{margin-left:auto;font-weight:400;font-size:13px}
  .shapes{display:flex;gap:6px;margin-bottom:14px;align-items:baseline}
  .shapes button{font-size:17px;font-weight:700;min-width:52px}
  .shapes .hint{font-size:13px;color:var(--muted);margin-left:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}
  .card{background:var(--panel);border-radius:10px;padding:12px 12px 8px}
  .card h2{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
  .card h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .card svg{display:block;width:100%;height:auto;max-width:230px;margin:0 auto}
  .card .formula{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 2px}
  .card .formula b{color:var(--ink)}
  .triads{background:#E4EEF6;border-radius:10px;padding:12px;--wood:#F3F6FA;--fret:#8FA3B8}
  .triads h2{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between}
  .triads h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .triads .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .triad{text-align:center;background:#D5E3EF;border-radius:8px;padding:10px 10px 6px}
  .triad svg{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
  .triad .cap{font-size:13px;color:var(--muted);margin-top:6px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px}

  .numsys{background:var(--panel);border-radius:10px;padding:12px;margin-top:14px}
  .numsys .cad{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 2px;font-size:13px;align-items:center}
  .numsys .cad>span{color:var(--muted)}
  .numsys .cad div{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .numsys .cad div b{margin-right:4px;color:var(--ink)}
  .numsys .cad div small{color:var(--muted);margin-right:4px}
  .numsys .cad button{padding:4px 8px;font-weight:600;background:var(--paper);font-size:13px}
  .ext{background:#EAF3EE;border-radius:10px;padding:12px;margin-top:14px;--wood:#F4F9F6;--fret:#8FB4A0}
  .ext h2,.slash h2{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .ext h2 small,.slash h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .ext .row,.slash .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .ext .triad{background:#DCEBE2}
  .ext p.note,.slash p.note{font-size:13px;color:var(--muted);margin:10px 0 0}
  .ext .cap b,.slash .cap b{color:var(--ink)}
  .slash{background:#F6EEE6;border-radius:10px;padding:12px;margin-top:14px;--wood:#FBF6F1;--fret:#C4A78A}
  .slash .triad{background:#EFE2D4}
  .slash h3{font-size:13px;font-weight:600;margin:14px 0 6px}
  .slash .bl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:13px}
  .slash .bl button{padding:4px 8px;font-weight:600;background:var(--paper);font-size:13px}
  .slash .bl small{color:var(--muted)}
  .numsys .secdom{margin:14px 0 10px}
  .numsys .secdom h3{font-size:13px;font-weight:600;margin:0 0 6px}
  .numsys .secdom table{border-collapse:collapse;font-size:13px}
  .numsys .secdom th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:2px 10px 4px 0}
  .numsys .secdom td{padding:3px 10px 3px 0;vertical-align:middle}
  .numsys .secdom td button{padding:4px 8px;font-weight:600;background:var(--paper);font-size:13px}
  .numsys .secdom .ex{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px}
  .numsys .secdom .ex b{margin-right:4px}
  .numsys .secdom .ex button{padding:4px 8px;font-weight:600;background:var(--paper);font-size:13px}
  .numsys .secdom .ex span.arr{color:var(--muted)}
  .practice .ivbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 10px;font-size:13px}
  .practice .ivbar button{font-size:13px}
  .practice .ivbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .practice .quiz{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0 14px}
  .practice .quiz .q{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
  .practice .quiz .q b{font-size:14px}
  .practice .quiz .ans{font-size:13px;margin-top:4px}
  .practice .quiz .ans b{color:var(--root)}
  .practice .revl{font-size:12px;padding:3px 8px;margin-left:8px}
  .practice .tpshape{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:4px 0 10px}
  .practice .tpshape .cb{background:#D9E8DD;border-radius:8px;padding:8px 10px 6px;text-align:center;width:150px;flex:none}
  .practice .tpshape .cb svg{width:100%;height:auto;display:block}
  .practice .tpshape .cb .nm{font-weight:700;font-size:14px}
  .practice .tpshape .cb .fn{font-size:11px;color:var(--muted)}
  .practice .tpshape .tabwrap{flex:1;min-width:280px}
  .practice .anch{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;font-size:13px;margin:8px 0 4px}
  .practice .anch span{color:var(--muted)}
  .listen{background:#EEF0F8;border-radius:10px;padding:12px;margin-top:14px}
  .listen h2{font-size:14px;font-weight:600;margin:0 0 8px}
  .listen h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .listen .ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .listen .ctl button.rec{background:var(--root);color:#fff;border-color:var(--root);font-weight:700;padding:8px 14px}
  .listen .ctl button.rec.stop{background:var(--ink);border-color:var(--ink)}
  .listen .live{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
  .listen .live div{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted)}
  .listen .live b{display:block;font-size:22px;color:var(--ink);font-weight:700}
  .listen .meter{height:8px;background:var(--paper);border-radius:4px;overflow:hidden;margin-bottom:10px}
  .listen .meter i{display:block;height:100%;background:var(--fifth);width:0%}
  .listen .rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;background:var(--paper);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .listen .rep .k{color:var(--muted);font-size:12px;display:block}
  .listen .rep b{color:var(--ink)}
  .listen .bars{display:flex;gap:3px;align-items:flex-end;height:44px;margin-top:4px}
  .listen .bars span{flex:1;background:var(--tone);border-radius:2px 2px 0 0;min-height:2px;position:relative}
  .listen .bars span.ct{background:var(--root)}
  .listen .bars span i{position:absolute;bottom:-14px;left:0;right:0;text-align:center;font-size:9px;font-style:normal;color:var(--muted)}
  .listen table.plan{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper);border-radius:8px;overflow:hidden}
  .listen table.plan th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  .listen table.plan td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .listen table.plan td.m{white-space:nowrap;font-weight:700}
  .listen table.plan td small{color:var(--muted);display:block}
  .listen table.plan button{font-size:12px;padding:3px 8px}
  .listen .days{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
  .listen .days button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .listen p.note{font-size:13px;color:var(--muted);margin:8px 0 0}
  .listen .warn{background:#FBECEC;color:#8A2A2A;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
  .modes{background:var(--panel);border-radius:10px;padding:12px;margin-top:14px}
  .modes h2{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
  .modes h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .modes .mrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
  .modes .mrow .lbl{font-size:12px;color:var(--muted);margin-right:4px;min-width:150px}
  .modes .mrow button{font-weight:600}
  .modes .mrow button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .modes .mrow button.cur{border-color:var(--root);color:var(--root)}
  .modes .mrow button.cur.on{background:var(--root);border-color:var(--root);color:#fff}
  .modes .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px;font-size:13px;margin:10px 0 12px;background:var(--paper);border-radius:8px;padding:10px 12px}
  .modes .info b{color:var(--ink)}
  .modes .info .k{color:var(--muted);font-size:12px;display:block}
  .modes .info .formula{font-size:15px;letter-spacing:.06em}
  .modes .info button{padding:3px 8px;font-size:12px;font-weight:600;background:var(--paper)}
  .modes .mneck{background:var(--paper);border-radius:8px;padding:8px 10px 2px;margin-bottom:12px;overflow-x:auto}
  .modes .mneck svg{display:block;width:100%;min-width:760px;height:auto}
  .modes .grid{margin-bottom:6px}
  .modes .grid .card{background:var(--paper)}
  .modes p.note{font-size:13px;color:var(--muted);margin:8px 0 0}
  .numsys h2{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .numsys h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .numsys .pattern{font-size:13px;color:var(--muted);margin:0 0 10px}
  .numsys .pattern b{color:var(--ink);letter-spacing:.18em;margin-right:6px}
  .keyrow{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:6px}
  .keyrow .deg{text-align:center;font-size:12px;color:var(--muted)}
  .keyrow .deg b{display:block;font-size:14px;color:var(--ink)}
  .keyrow .step{grid-column:span 1;text-align:center;font-size:11px;color:var(--muted)}
  .chordbtn{width:100%;padding:8px 4px;font-weight:600;font-size:15px;background:var(--paper)}
  .chordbtn.dim{color:var(--muted)}
  .chordbtn.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
  .deg .rel{display:block;font-size:10px;color:var(--fifth);font-weight:600;margin-bottom:-2px}
  .relbtn{font-size:13px;color:var(--fifth);border-color:var(--fifth);margin-right:8px}
  .chordbtn small{display:block;font-size:10px;font-weight:400;opacity:.75;line-height:1}
  .allkeys td button.tone{background:var(--ink);color:#fff}
  .allkeys td button.tone:hover{background:var(--ink)}
  .chordbtn.tR,.allkeys td button.tR,.allkeys td button.tR:hover{background:var(--root);border-color:var(--root);color:#fff}
  .chordbtn.t3,.allkeys td button.t3,.allkeys td button.t3:hover{background:var(--third);border-color:var(--third);color:#fff}
  .chordbtn.t5,.allkeys td button.t5,.allkeys td button.t5:hover{background:var(--fifth);border-color:var(--fifth);color:#fff}
  .chordbtn.t7,.allkeys td button.t7,.allkeys td button.t7:hover{background:var(--seventh);border-color:var(--seventh);color:#fff}
  .chordbtn.cur.dim,.allkeys td button.tone.dim{color:#fff}
  .steps{display:grid;grid-template-columns:repeat(8,1fr);margin:0 0 4px}
  .steps span{text-align:center;font-size:11px;color:var(--muted);transform:translateX(50%)}
  .steps span:last-child{visibility:hidden}
  .allkeys{margin-top:14px;overflow-x:auto}
  .allkeys table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
  .allkeys th{font-weight:600;font-size:12px;color:var(--muted);text-align:center;padding:4px 6px;border-bottom:2px solid var(--line)}
  .allkeys th:first-child,.allkeys td:first-child{text-align:left}
  .allkeys td{padding:0;border-bottom:1px solid var(--line)}
  .allkeys td button{border:0;border-radius:0;width:100%;padding:7px 6px;text-align:center}
  .allkeys td:first-child button{text-align:left;font-weight:700;padding-left:10px}
  .allkeys td button:hover{background:#E4EEF6}
  .allkeys tr.cur td{background:#D5E3EF}
  .allkeys td button.dim{color:var(--muted)}

  .drop2{background:#F1EAF6;border-radius:10px;padding:12px;margin-top:14px;--wood:#F8F5FB;--fret:#A996BE}
  .drop2 h2{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between}
  .drop2 h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .drop2 .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .drop2 .triad{background:#E3D9EC}
  #printarea{display:none}
  @media print{
    @page{size:landscape;margin:8mm}
    body{font-size:11px}
    .wrap{max-width:none;padding:0}
    .wrap>*:not(#printarea){display:none!important}
    #printarea{display:block}
    .prow{display:grid;grid-template-columns:70px repeat(4,1fr);gap:8px;align-items:start;border-top:1px solid var(--line);padding:6px 0;break-inside:avoid}
    .prow .pl{font-size:20px;font-weight:700}
    .prow .pl small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
    .prow svg{width:100%;max-width:170px;height:auto;display:block;margin:0 auto}
    .prow .pt{text-align:center;font-size:10px;color:var(--muted)}
    .ptitle{font-size:18px;font-weight:700;margin:0 0 4px}
  }

  .cowboy{background:#EEF3E8;border-radius:10px;padding:12px;margin-top:14px;--wood:#F7F9F3;--fret:#9DAA8C}
  .cowboy h2{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .cowboy h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .cowboy .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .cowboy .cb{background:#DFE7D4;border-radius:8px;padding:8px 8px 6px;border:2px solid transparent;cursor:pointer;text-align:center}
  .cowboy .cb:hover{border-color:var(--fifth)}
  .cowboy .cb.cur{border-color:var(--ink)}
  .cowboy .cb svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
  .cowboy .cb .nm{font-weight:700;font-size:15px;margin-top:4px}
  .cowboy .cb .sh{font-size:11px;color:var(--muted)}
  .cowboy .grp{font-size:12px;color:var(--muted);margin:10px 0 6px}

  .dyads{background:#FBEFE6;border-radius:10px;padding:12px;margin-top:14px}
  .dyads h2{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .dyads h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .dyads .ctl{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .dyads .ctl .group button{padding:5px 9px;font-size:13px}
  .dyads .ctl .group button.on{background:#B5562A;border-color:#B5562A}
  .dyads .neckwrap{background:#fff;border-radius:8px;padding:10px 12px 4px;overflow-x:auto}
  .dyads .neckwrap svg{display:block;width:100%;min-width:760px;height:auto}
  .dyads .list{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
  .dyads .list b{color:var(--ink)}
  .dyads .dyrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;--wood:#FFF7F1;--fret:#C9A28B}
  .dyads .dyrow .triad{background:#F4DCCB;border-radius:8px;padding:8px 8px 6px;text-align:center}
  .dyads .dyrow .triad svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
  .dyads .dyrow .degl{font-weight:700;font-size:15px}
  .dyads .dyrow .cap{font-size:12px;color:var(--muted);margin-top:4px}
  .dyads .allkeys{margin-top:12px}
  .dyads .allkeys td button{line-height:1.25;padding:5px 4px}
  .dyads .allkeys td button small{color:var(--muted);font-size:10px}
  .dyads .allkeys td button .fr{color:#B5562A;font-size:11px}
  .dyads .allkeys tr.cur td{background:#F4DCCB}

  .seq{background:#FFF4E0;border-radius:10px;padding:12px;margin-top:14px;--wood:#FFFBF2;--fret:#CDB48A}
  .seq h2{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .seq h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .seq .ctl .group button.on{background:#B5562A;border-color:#B5562A}
  .seq .body{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start;margin-top:8px}
  .seq .boxcard{background:#F7E7C6;border-radius:8px;padding:10px;text-align:center}
  .seq .boxcard svg{width:100%;max-width:240px;height:auto;display:block;margin:0 auto}
  .seq .routelist{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
  .seq .routelist div{font-size:14px}
  .seq .routelist small{display:block;font-size:11px;color:var(--muted)}
  .seq .routelist .arrow{color:var(--muted)}
  .seq .boxcard .cap{font-size:12px;color:var(--muted);margin-top:4px}
  .seq .tabwrap{background:#fff;border-radius:8px;padding:10px 12px;overflow-x:auto}

<div class="wrap">

    <div class="group"><button id="printBtn">Print this key</button><button id="homeBtn" title="Reset everything to C major, C shape">⌂ Home</button></div>
    <div class="group"><span class="lbl">Playback</span><span class="lbl">♩ =</span><input type="number" id="bpmIn" value="90" min="30" max="240" style="width:62px;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px"><button id="swingBtn">Swing</button><button id="clickBtn" class="on">Click</button></div>
  </header>

  <div class="neck" id="neck"></div>

<script>
// ---------- music theory ----------
const NOTES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_FLAT  = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];   // F# kept for the six-sharp/six-flat key
const FLAT_MAJORS = new Set([5,10,3,8,1]);                                   // F, Bb, Eb, Ab, Db
// spelling follows the selected key: minor keys go by their relative major. state is defined later; until then, sharps.
const useFlats = () => { if(typeof state==='undefined') return false; const maj = MINORISH.includes(state.quality) ? (state.root+3)%12 : state.root; return FLAT_MAJORS.has(maj); };
const NOTES = new Proxy(NOTES_SHARP, { get(t,prop){ if(typeof prop==='string' && /^\d+$/.test(prop)) return (useFlats()?NOTES_FLAT:NOTES_SHARP)[+prop]; return Reflect.get(t,prop); } });
const TUNING = [4,9,2,7,11,4];            // low E → high E, pitch classes
const MAX_FRET = 17;
const SCALE = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10], dom7:[0,2,4,5,7,9,10], maj7:[0,2,4,5,7,9,11], dim7:[0,2,3,5,6,8,9,11], min7:[0,2,3,5,7,8,10], m7b5:[0,1,3,5,6,8,10] };
const PENTA = { major:[0,2,4,7,9],       minor:[0,3,5,7,10],    dom7:null, maj7:[0,2,4,7,9], dim7:null, min7:[0,3,5,7,10], m7b5:null };
const CHORD = { major:[0,4,7],           minor:[0,3,7],         dom7:[0,4,7,10], maj7:[0,4,7,11], dim7:[0,3,6,9], min7:[0,3,7,10], m7b5:[0,3,6,10] };
const TRIAD = { major:[0,4,7],           minor:[0,3,7],         dom7:[0,4,7],    maj7:[0,4,7],    dim7:[0,3,6],    min7:[0,3,7],    m7b5:[0,3,6] };
const INTV  = { major:{0:'R',2:'2',4:'3',5:'4',7:'5',9:'6',11:'7'},
                minor:{0:'R',2:'2',3:'b3',5:'4',7:'5',8:'b6',10:'b7'},
                dom7:{0:'R',2:'2',4:'3',5:'4',7:'5',9:'6',10:'b7'},
                maj7:{0:'R',2:'2',4:'3',5:'4',7:'5',9:'6',11:'7'},
                dim7:{0:'R',2:'2',3:'b3',5:'4',6:'b5',8:'b6',9:'bb7',11:'7'},
                min7:{0:'R',2:'2',3:'b3',5:'4',7:'5',8:'b6',10:'b7'},
                m7b5:{0:'R',1:'b2',3:'b3',5:'4',6:'b5',8:'b6',10:'b7'} };

// Shape windows relative to the root's fret on the low E string (R6).
// Chord voicings are fret offsets from that same R6, per string low→high; null = not played.
const SHAPES = {
  E:{ win:[-1,2],  winMinor:[0,3],   winDom:[-2,2], major:[0,2,2,1,0,0],          minor:[0,2,2,0,0,0],          dom7:[0,2,0,1,0,0],          maj7:[0,2,1,1,0,0],          dim7:[0,1,2,0,2,0],          min7:[0,2,0,0,0,0],          m7b5:[0,1,0,0,null,0],       sus2:[0,2,4,4,0,0],          sus4:[0,2,2,2,0,0],          add9:[0,2,2,1,0,2] },
  D:{ win:[1,5],   winMinor:[2,5],   winPent:[1,5], major:[null,null,2,4,5,4],    minor:[null,null,2,4,5,3],    dom7:[null,null,2,4,3,4],    maj7:[null,null,2,4,4,4],    dim7:[null,null,2,3,2,3],    min7:[null,null,2,4,3,3],    m7b5:[null,null,2,3,3,3],    sus2:[null,null,2,4,5,2],    sus4:[null,null,2,4,5,5],    add9:[null,null,2,1,0,2] },
  C:{ win:[4,7],   winMinor:[4,7],   winPentMinor:[4,8], major:[null,7,6,4,5,4],       minor:[null,7,5,4,5,7],       dom7:[null,7,6,7,5,4],       maj7:[null,7,6,4,4,4],       dim7:[null,7,8,6,8,6],       min7:[null,7,5,7,5,null],    m7b5:[null,7,5,7,8,null],    sus2:[null,7,4,4,5,null],    sus4:[null,7,7,4,5,5],       add9:[null,7,6,4,7,4] },
  A:{ win:[-6,-3], winMinor:[-5,-2], major:[null,-5,-3,-3,-3,-5],  minor:[null,-5,-3,-3,-4,-5],  dom7:[null,-5,-3,-5,-3,-5],  maj7:[null,-5,-3,-4,-3,-5],  dim7:[null,-5,-4,-3,-4,-3],  min7:[null,-5,-3,-5,-4,-5],  m7b5:[null,-5,-4,-5,-4,null], sus2:[null,-5,-3,-3,-5,-5],  sus4:[null,-5,-3,-3,-2,-5],  add9:[null,-5,-3,-1,-3,-5] },
  G:{ win:[-3,0],  winMinor:[-3,0],  major:[0,-1,-3,-3,-3,0],      minor:[0,-2,-3,-3,null,0],    dom7:[0,-1,-3,-3,-3,-2],     maj7:[0,-1,-3,-3,-3,-1],     dim7:[0,null,-1,0,-1,null],  min7:[0,-2,-3,-3,null,-2],   m7b5:[0,null,0,0,-1,null],   sus2:[0,-3,-3,-3,0,0],       sus4:[0,0,-3,-3,-2,0],       add9:[0,-1,-3,-1,-3,0] },
};
const ORDER = ['E','D','C','A','G'];
// Pop progressions: every combination has a fixed number 1–1620 = (progression, key, shape, voicing)
const POP_KEYS=['k1','k2','k3','k4','k5','k6','k7','k8','k9'], POP_SHAPES=['C','A','G','E','D'], POP_VOICES=['std','alt','sus'];
const popNum=(prog,root,shape,voice)=>((POP_KEYS.indexOf(prog)*12+root)*5+Math.max(0,POP_SHAPES.indexOf(shape)))*3+POP_VOICES.indexOf(voice)+1;
const popFromNum=n=>{ n=Math.min(1620,Math.max(1,Math.round(n)))-1; const voice=POP_VOICES[n%3]; n=Math.floor(n/3); const shape=POP_SHAPES[n%5]; n=Math.floor(n/5); const root=n%12; const prog=POP_KEYS[Math.floor(n/12)]; return {prog,root,shape,voice}; };
const MINORISH = ['minor','min7','m7b5','dim7'];
const QNAME = {major:'major',minor:'minor',dom7:'dominant 7th',maj7:'major 7th',min7:'minor 7th',m7b5:'half-diminished',dim7:'diminished 7th'};
const SUFFIX = {major:'',minor:'m',dom7:'7',maj7:'maj7',min7:'m7',m7b5:'m7b5',dim7:'dim7'};
const SCALENAME = {major:'major',minor:'natural minor',dom7:'Mixolydian',maj7:'major (Ionian)',min7:'natural minor (Aeolian)',m7b5:'Locrian',dim7:'diminished (whole–half)'};

const state = { root:0, quality:'major', shape:'E', labels:'note', key:0, keyMode:'major', pos:'caged', dyad:2, pair:[4,5], dyadView:'neck', seqDir:'asc', seqRange:'box', tabFlip:false, section:'shapes', neckHidden:false, dsPair:[4,5], dsMode:'box', mood:0, routine:'scales', twProg:'p1', popProg:'k1', popVoice:'std', popRandKey:true, popRandShape:true, popHist:(()=>{try{return JSON.parse(localStorage.getItem('caged-popHist')||'[]')}catch(e){return []}})(), bluesVar:0, legPat:0, legCyc:0, runMelodic:true, ppDensity:5, ppStart:0, boogieOpen:true, bluesSolo:false, popHistIdx:(()=>{try{const v=+localStorage.getItem('caged-popHistIdx');return isNaN(v)?-1:v}catch(e){return -1}})(), modeId:'ionian', harm:false, ivHide:false, ivQuiz:null, ivRevealed:[], ivLevel:1, tpShape:'all' };

const pc = (s,f) => (TUNING[s]+f)%12;
const iv = (s,f) => (pc(s,f)-state.root+12)%12;
const colour = i => { const c=CHORD[state.quality]; return i===0?'var(--root)':(i===3||i===4)?'var(--third)':((i===7||i===6)&&c.includes(i))?'var(--fifth)':((i===9||i===10||i===11)&&c.includes(i))?'var(--seventh)':'var(--tone)'; };
const label  = i => state.labels==='note' ? NOTES[(state.root+i)%12] : (INTV[state.quality][i] ?? '');

// place a relative window on the real neck
function placeShape(name,kind){
  const r6 = (state.root-4+12)%12;
  if(state.pos==='open') return { lo:0, hi:3, r6:(state.root-4+12)%12 };
  const sh=SHAPES[name];
  const pent = kind==='pent';
  const win = (state.quality==='dom7'&&sh.winDom) ? sh.winDom : MINORISH.includes(state.quality) ? ((pent&&sh.winPentMinor)?sh.winPentMinor:sh.winMinor) : ((pent&&sh.winPent)?sh.winPent:sh.win);
  let lo = r6+win[0], hi = r6+win[1], shift=0;
  if(lo<0){shift=12} else if(hi>MAX_FRET){shift=-12}
  return { lo:lo+shift, hi:hi+shift, r6:r6+shift };
}
function chordFrets(name){
  const {r6} = placeShape(name);
  return SHAPES[name][state.quality].map(o => o===null?null:o+r6);
}

// ---------- SVG helpers ----------
function dot(x,y,r,i,txt){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${colour(i)}"/>` +
         `<text x="${x}" y="${y+r*0.36}" text-anchor="middle" font-size="${r*1.05}" font-weight="600" fill="#fff">${txt}</text>`;
}

// chord-tone dot: note name inside, scale degree (R/3/5/7) in a small badge at top-right.
// When the global Labels toggle is on Intervals the dot already shows the degree, so no badge.
function chordDot(x,y,r,i){
  const deg = INTV[state.quality][i] ?? '';
  if(state.labels!=='note' || !deg) return dot(x,y,r,i,label(i));
  const bx=x+r*0.78, by=y-r*0.78, br=r*0.52;
  return dot(x,y,r,i,label(i)) +
    `<circle cx="${bx}" cy="${by}" r="${br}" fill="var(--paper)" stroke="${colour(i)}" stroke-width="1.2"/>` +
    `<text x="${bx}" y="${by+br*0.38}" text-anchor="middle" font-size="${br*1.25}" font-weight="700" fill="${colour(i)}">${deg}</text>`;
}

// vertical chord-box diagram: notes = array of {s,f,i}; muted = set of string idx
function box(lo,hi,notes,muted,dotFn){
  const D = dotFn || ((x,y,r,i)=>dot(x,y,r,i,label(i)));
  const cell=28, w=6*cell+14, top=22, left=26, gl = lo===0?1:lo;
  const nF = hi-gl+1, h=top+nF*cell+10;
  const sx = s => left+s*cell, fy = f => top+(f-gl+0.5)*cell;
  let o=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
  o+=`<rect x="${left}" y="${top}" width="${5*cell}" height="${nF*cell}" fill="var(--wood)"/>`;
  for(let f=0;f<=nF;f++){
    const y=top+f*cell, nut = (lo===0&&f===0);
    o+=`<line x1="${left}" x2="${left+5*cell}" y1="${y}" y2="${y}" stroke="${nut?'var(--ink)':'var(--fret)'}" stroke-width="${nut?4:1.5}"/>`;
  }
  for(let s=0;s<6;s++) o+=`<line x1="${sx(s)}" x2="${sx(s)}" y1="${top}" y2="${top+nF*cell}" stroke="var(--string)" stroke-width="${1.2+ (5-s)*0.25}"/>`;
  for(let f=gl;f<=hi;f++) o+=`<text x="${left-10}" y="${fy(f)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${f}</text>`;
  for(let s=0;s<6;s++){
    const m = muted && muted.has(s);
    o+=`<text x="${sx(s)}" y="${top-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${m?'×':NOTES[TUNING[s]]}</text>`;
  }
  for(const n of notes){
    if(n.f===0 && lo===0) o+=D(sx(n.s), top-8, 9, n.i); // open string, drawn above the nut
    else o+=D(sx(n.s), fy(n.f), 10.5, n.i);
  }
  return o+'</svg>';
}

// ---------- views ----------
function scaleView(name,set,kind){
  const {lo,hi} = placeShape(name,kind), notes=[];
  for(let s=0;s<6;s++) for(let f=lo;f<=hi;f++){ const i=iv(s,f); if(set.includes(i)) notes.push({s,f,i}); }
  return box(lo,hi,notes);
}
function cowboyFor(root,q){ for(const [,list] of COWBOY) for(const c of list) if(c[1]===root&&c[2]===q) return c; return null; }
function chordView(name){
  if(state.pos==='open'){ const c=cowboyFor(state.root,state.quality); if(!c) return `<p class="formula" style="padding:30px 6px">No standard open-position voicing for this chord — switch to CAGED shapes to see it as a movable shape.</p>`;
    const frets=c[4], notes=frets.map((f,si)=>f===null?null:{s:si,f,i:iv(si,f)}).filter(Boolean);
    return box(0,3,notes,new Set(frets.map((f,si)=>f===null?si:-1).filter(x=>x>=0))); }
  const frets = chordFrets(name), {lo,hi} = placeShape(name);
  const played = frets.filter(f=>f!==null);
  const dlo = Math.min(lo,...played), dhi = Math.max(hi,...played);
  const notes = frets.map((f,s)=> f===null?null:{s,f,i:iv(s,f)}).filter(Boolean);
  return box(dlo,dhi,notes,new Set(frets.map((f,s)=>f===null?s:-1).filter(s=>s>=0)));
}

// closed-voice triads on adjacent string sets that overlap the shape window
function triadView(name, tones){
  const {lo,hi} = placeShape(name), found=[]; tones = tones || TRIAD[state.quality];
  const upper = tones[0]!==0;
  const sets=[[3,4,5],[2,3,4],[1,2,3],[0,1,2]];
  for(const [a,b,c] of sets){
    for(let fa=0;fa<=MAX_FRET;fa++) for(let fb=0;fb<=MAX_FRET;fb++) for(let fc=0;fc<=MAX_FRET;fc++){
      const mn=Math.min(fa,fb,fc), mx=Math.max(fa,fb,fc);
      if(mx-mn>3) continue;
      if(mx<lo-1 || mn>hi+1) continue;
      const is=[iv(a,fa),iv(b,fb),iv(c,fc)];
      if(!is.every(i=>tones.includes(i)) || new Set(is).size!==3) continue;
      const bass = is[0], bi = tones.indexOf(bass), inv = bi===0?'root position':bi===2?'2nd inversion':'1st inversion';
      const slash = (upper||bass===0)?'':' \u00b7 '+NOTES[state.root]+SUFFIX[state.quality].replace(/7.*$/,'')+'/'+NOTES[(state.root+bass)%12];
      const strings = `${NOTES[TUNING[a]]}${NOTES[TUNING[b]]}${NOTES[TUNING[c]]}`;
      const muted = new Set([0,1,2,3,4,5].filter(s=>s!==a&&s!==b&&s!==c));

}

// ---------- full neck strip ----------
function neckView(){
  const w=1000,h=150, left=40, cell=(w-left-20)/(MAX_FRET+1), top=34, sh=14;
  const fx = f => left+(f+0.5)*cell, sy = s => top+(5-s)*sh;
  let o=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  o+=`<rect x="${left+cell}" y="${top-7}" width="${w-20-left-cell}" height="${5*sh+14}" fill="var(--wood)"/>`;
  for(let f=1;f<=MAX_FRET+1;f++) o+=`<line x1="${left+f*cell}" x2="${left+f*cell}" y1="${top-7}" y2="${top+5*sh+7}" stroke="${f===1?'var(--ink)':'var(--fret)'}" stroke-width="${f===1?4:1.5}"/>`;
  for(const f of [3,5,7,9,15,17]) o+=`<circle cx="${fx(f)}" cy="${top+2.5*sh}" r="4" fill="#fff" opacity=".9"/>`;
  o+=`<circle cx="${fx(12)}" cy="${top+1.5*sh}" r="4" fill="#fff" opacity=".9"/><circle cx="${fx(12)}" cy="${top+3.5*sh}" r="4" fill="#fff" opacity=".9"/>`;
  for(let s=0;s<6;s++) o+=`<line x1="${left}" x2="${w-20}" y1="${sy(s)}" y2="${sy(s)}" stroke="var(--string)" stroke-width="${1+(5-s)*0.3}"/>`;
  for(let f=0;f<=MAX_FRET;f++) o+=`<text x="${fx(f)}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${f}</text>`;
  // the chord's own voicing in each CAGED shape: a dotted grey outline through its notes, so the triad is visible inside the band
  if(state.pos!=='open') for(const n of ORDER){ const ps=placeShape(n), offs=SHAPES[n][state.quality]; if(!offs) continue;
    const pts=offs.map((of,st)=>of===null?null:{s:st,f:of+ps.r6}).filter(Boolean); if(pts.some(pt=>pt.f<0||pt.f>MAX_FRET)) continue;
    // a dotted hull around the voicing's notes (convex hull, pushed out a little from its centre)
    const P=pts.map(pt=>[fx(pt.f),sy(pt.s)]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cross=(o2,a,b)=>(a[0]-o2[0])*(b[1]-o2[1])-(a[1]-o2[1])*(b[0]-o2[0]);
    const lower=[]; for(const pt of P){ while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],pt)<=0) lower.pop(); lower.push(pt); }
    const upper=[]; for(const pt of P.slice().reverse()){ while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],pt)<=0) upper.pop(); upper.push(pt); }
    const hull=lower.slice(0,-1).concat(upper.slice(0,-1)); const cx=hull.reduce((a,p2)=>a+p2[0],0)/hull.length, cy=hull.reduce((a,p2)=>a+p2[1],0)/hull.length;
    const out=hull.map(([x,y])=>{ const dx=x-cx, dy=y-cy, L=Math.hypot(dx,dy)||1; return [x+dx/L*11+(dx===0?0:0), y+dy/L*11]; });
    const d=out.map((p2,k)=>`${k?'L':'M'}${p2[0].toFixed(1)},${p2[1].toFixed(1)}`).join(' ')+' Z';
    o+=`<path d="${d}" fill="none" stroke="var(--tone)" stroke-width="1.3" stroke-dasharray="3 3.5" stroke-linejoin="round" stroke-linecap="round" opacity="${n===state.shape?.85:.28}"/>`;
    if(n===state.shape) pts.forEach(pt=>{ o+=`<circle cx="${fx(pt.f)}" cy="${sy(pt.s)}" r="7.5" fill="none" stroke="var(--tone)" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>`; }); }
  // every scale tone on the neck: chord tones solid in their colour, the other scale notes white with a keyline
  const scaleSet=SCALE[state.quality]||SCALE.major;
  for(let s=0;s<6;s++) for(let f=0;f<=MAX_FRET;f++){ const i=iv(s,f);
    if(i===0) o+=`<circle cx="${fx(f)}" cy="${sy(s)}" r="5.5" fill="var(--root)"/>`;
    else if(CHORD[state.quality].includes(i)) o+=`<circle cx="${fx(f)}" cy="${sy(s)}" r="4.5" fill="${colour(i)}"/>`;
    else if(scaleSet.includes(i)) o+=`<circle cx="${fx(f)}" cy="${sy(s)}" r="3.5" fill="#fff" stroke="var(--tone)" stroke-width="1.2" opacity=".9"/>`;
  }
  // shape bands
  if(state.pos==='open'){ const x1=left, x2=left+4*cell; o+=`<g class="band on"><rect x="${x1}" y="12" width="${x2-x1}" height="${h-26}" rx="6"/><text x="${(x1+x2)/2}" y="24" text-anchor="middle">Open</text></g>`; }
  else for(const n of ORDER){ const {lo,hi}=placeShape(n), on=n===state.shape;
    const x1=lo===0?left:left+lo*cell, x2=left+(hi+1)*cell;
    o+=`<g class="band ${on?'on':''}" data-shape="${n}"><rect x="${x1}" y="12" width="${x2-x1}" height="${h-26}" rx="6"/>`+
       `<text x="${(x1+x2)/2}" y="${on?24:22}" text-anchor="middle">${n}</text></g>`;
  }
  return o+'</svg>';
}



// four-note (drop-2 style) voicings on adjacent string sets, one chord tone per string
function drop2View(name){
  const {lo,hi} = placeShape(name), tones = CHORD[state.quality], found=[];
  if(tones.length<4) return found;
  const sets=[[2,3,4,5],[1,2,3,4],[0,1,2,3]];
  for(const st of sets){
    const rec=(idx,frets)=>{
      if(idx===4){
        const mn=Math.min(...frets), mx=Math.max(...frets);
        if(mx-mn>3 || mx<lo-1 || mn>hi+1) return;
        const is=frets.map((f,k)=>iv(st[k],f));
        if(new Set(is).size!==4) return;
        const muted=new Set([0,1,2,3,4,5].filter(x=>!st.includes(x)));
        const strings=st.map(x=>NOTES[TUNING[x]]).join('');
        const bass=label(is[0]);
        found.push({svg:box(mn,mn+3,st.map((x,k)=>({s:x,f:frets[k],i:is[k]})),muted,chordDot),cap:`${strings} strings · ${bass} in the bass`,sort:st[0]*100+mn});
        return;
      }
      for(let f=0;f<=MAX_FRET;f++) if(tones.includes(iv(st[idx],f))) rec(idx+1,[...frets,f]);
    };
    rec(0,[]);
  }
  found.sort((x,y)=>y.sort-x.sort);
  return found;
}

// ---------- dyads: the scale harmonised in intervals on a string pair ----------
const DYADS = [[1,'2nds'],[2,'3rds'],[3,'4ths'],[4,'5ths'],[5,'6ths'],[7,'Octaves']];
const PAIRS = [[4,5],[3,4],[2,3],[1,2],[0,1],[3,5],[2,4],[1,3],[0,2]];

function dyadsView(){

  for(let f=1;f<=MAX_FRET+1;f++) o+=`<line x1="${left+f*cell}" x2="${left+f*cell}" y1="${top-9}" y2="${top+5*sh+9}" stroke="${f===1?'var(--ink)':'var(--fret)'}" stroke-width="${f===1?4:1.5}"/>`;

  o+=`<circle cx="${fx(12)}" cy="${top+1.5*sh}" r="4" fill="#fff" opacity=".9"/><circle cx="${fx(12)}" cy="${top+3.5*sh}" r="4" fill="#fff" opacity=".9"/>`;
  for(let st=0;st<6;st++){ const on=st===ls||st===us;
    o+=`<line x1="${left}" x2="${w-20}" y1="${sy(st)}" y2="${sy(st)}" stroke="${on?'var(--ink)':'var(--string)'}" stroke-width="${(1+(5-st)*0.3)*(on?1.6:1)}" opacity="${on?1:.4}"/>`;

  }

  html+=`<div class="ctl">`;
  html+=`<span class="group"><span class="lbl">Strings</span>${PAIRS.map(([a,b])=>`<button data-pair="${a},${b}" class="${a===ls&&b===us?'on':''}">${pairName(a)} + ${pairName(b)}</button>`).join('')}</span>`;
  html+=`<span class="group"><span class="lbl">Layout</span><button data-dv="neck" class="${state.dyadView==='neck'?'on':''}">Along the neck</button><button data-dv="boxes" class="${state.dyadView==='boxes'?'on':''}">Vertical boxes</button></span></div>`;
  if(state.dyadView==='neck') html+=`<div class="neckwrap">${o}</div>`;
  else {

    const muted=new Set([0,1,2,3,4,5].filter(x=>x!==ls&&x!==us));

  for(let r=0;r<12;r++){ const ds=dyadsFor(r);
    html+=`<tr class="${r===state.root?'cur':''}"><td><button data-dyroot="${r}">${NOTES[r]}</button></td>${[1,2,3,4,5,6,7].map(d=>{const x=ds.find(y=>y.deg===d); return `<td><button data-dyroot="${r}">${x?`${x.lo}–${x.up} <span class="fr">${x.f}/${x.uf}</span><br><small>${IVNAME[x.semis]||x.semis}</small>`:'—'}</button></td>`}).join('')}</tr>`; }

}


// ---------- scale in intervals, ascending through the current position ----------
const BASE = [40,45,50,55,59,64]; // MIDI of open strings
function seqView(){
  if(state.dyad===1&&state.seqRange==='pair') state.seqRange='box';
  const q=state.quality, sc=SCALE[q], k=state.dyad, name=state.shape;
  const {lo,hi}=placeShape(name);
  let notes=[];
  for(let st=0;st<6;st++) for(let f=lo;f<=hi;f++){ const i=iv(st,f); if(sc.includes(i)) notes.push({s:st,f,i,pitch:BASE[st]+f}); }
  notes.sort((a,b)=>a.pitch-b.pitch || a.s-b.s);
  notes=notes.filter((n,j)=>j===0||n.pitch!==notes[j-1].pitch);
  notes.forEach((n,j)=>n.n=j+1);
  let route=[], neckPairs=null;   // shape changes along the run (across-the-neck mode)
  if(state.seqRange==='neck'){
    // two octaves root to root, moving up through the CAGED boxes in neck order
    const savedPos=state.pos; state.pos='caged';
    const boxes=ORDER.map(n=>{ const w=placeShape(n); const bn=[]; for(let st=0;st<6;st++) for(let f=w.lo;f<=w.hi;f++){ const i=iv(st,f); if(sc.includes(i)) bn.push({s:st,f,i,pitch:BASE[st]+f}); }
      bn.sort((a,b)=>a.pitch-b.pitch||a.s-b.s); return {name:n,lo:w.lo,hi:w.hi,notes:bn.filter((n2,j)=>j===0||n2.pitch!==bn[j-1].pitch)}; }).sort((a,b)=>a.lo-b.lo);
    state.pos=savedPos;
    // the two-octave pitch sequence, root to root; each pair is placed whole inside one box, and the boxes are taken in neck order
    const all=[]; boxes.forEach((bx,bi)=>bx.notes.forEach(n=>all.push({...n,bi})));
    const rootP=Math.min(...all.filter(n=>n.i===0).map(n=>n.pitch)), endP=rootP+24;
    const pitches=[...new Set(all.filter(n=>n.pitch>=rootP&&n.pitch<=endP).map(n=>n.pitch))].sort((a,b)=>a-b);
    const pp=[]; for(let j=0;j+k<pitches.length;j++) pp.push([pitches[j],pitches[j+k]]);
    const has=(bi,pch)=>boxes[bi].notes.find(x=>x.pitch===pch);
    const usable=boxes.map((bx,bi)=>bi).filter(bi=>pp.some(([lo2,hi2])=>has(bi,lo2)&&has(bi,hi2)));
    neckPairs=[]; let cur=0;
    pp.forEach(([lo2,hi2],m)=>{ const target=usable[Math.min(usable.length-1,Math.floor(m*usable.length/pp.length))]; const want=Math.max(cur,target); let bi=null;
      for(const c of usable){ if(c>=want&&has(c,lo2)&&has(c,hi2)){ bi=c; break; } }
      if(bi===null) for(const c of usable){ if(c>=cur&&has(c,lo2)&&has(c,hi2)){ bi=c; break; } }
      if(bi===null) for(const c of usable){ if(has(c,lo2)&&has(c,hi2)){ bi=c; break; } }
      if(bi===null) return;
      if(!neckPairs.length||bi!==neckPairs[neckPairs.length-1].bi) route.push({at:neckPairs.length,name:boxes[bi].name+' shape'});
      neckPairs.push({bi,a:has(bi,lo2),b:has(bi,hi2)}); cur=bi; });
  }
  let pairs=[]; if(neckPairs) pairs=neckPairs.map(x=>[x.a,x.b]); else for(let j=0;j+k<notes.length;j++) pairs.push([notes[j],notes[j+k]]);
  if(state.seqRange==='root'){ // trim to run from the first pair that starts on a root to the last pair that ends on a root
    const a=pairs.findIndex(pr=>pr[0].i===0); let b=-1; pairs.forEach((pr,j)=>{ if(pr[1].i===0) b=j; });
    if(a>=0&&b>=a) pairs=pairs.slice(a,b+1); else if(a>=0) pairs=pairs.slice(a); }
  let marks=route.map(m=>({at:m.at,name:m.name}));   // pair index where each shape starts (lower note enters the new box)
  if(state.seqDir==='desc'){ const L=pairs.length; marks=marks.map(m=>({at:Math.max(0,L-1-m.at),name:m.name})).reverse(); pairs.reverse(); pairs.forEach(pr=>pr.reverse()); }
  marks=marks.filter(m=>m.at<pairs.length);
  const rowY = st => 24+(state.tabFlip?st:(5-st))*18;
  const kName=DYADS.find(x=>x[0]===k)[1];
  // box with notes numbered in playing order
  const cell=28,w=6*cell+14,top=22,left=26,gl=lo===0?1:lo,nF=hi-gl+1,h=top+nF*cell+10;
  const sx=st=>left+st*cell, fy=f=>top+(f-gl+0.5)*cell;
  let bx=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><rect x="${left}" y="${top}" width="${5*cell}" height="${nF*cell}" fill="var(--wood)"/>`;
  for(let f=0;f<=nF;f++){const y=top+f*cell,nut=(lo===0&&f===0);bx+=`<line x1="${left}" x2="${left+5*cell}" y1="${y}" y2="${y}" stroke="${nut?'var(--ink)':'var(--fret)'}" stroke-width="${nut?4:1.5}"/>`;}
  for(let st=0;st<6;st++){bx+=`<line x1="${sx(st)}" x2="${sx(st)}" y1="${top}" y2="${top+nF*cell}" stroke="var(--string)" stroke-width="${1.2+(5-st)*0.25}"/>`;bx+=`<text x="${sx(st)}" y="${top-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${NOTES[TUNING[st]]}</text>`;}
  for(let f=gl;f<=hi;f++) bx+=`<text x="${left-10}" y="${fy(f)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${f}</text>`;
  for(const n of notes){const y=(n.f===0&&lo===0)?top-8:fy(n.f), r=(n.f===0&&lo===0)?9:10.5; bx+=`<circle cx="${sx(n.s)}" cy="${y}" r="${r}" fill="${colour(n.i)}"/><text x="${sx(n.s)}" y="${y+r*0.36}" text-anchor="middle" font-size="${r*1.0}" font-weight="600" fill="#fff">${label(n.i)}</text>`;}
  bx+='</svg>';

const ROMAN = { major:['I','ii','iii','IV','V','vi','vii°'], minor:['i','ii°','III','iv','v','VI','VII'] };
function harmonise(key,mode){
  const sc = SCALE[mode];

// ---------- generic voicing finder: one note per string on adjacent strings, within a 4-fret window, nearest the current box ----------
const BASEMIDI=[40,45,50,55,59,64];
function perms(a){ if(a.length<=1) return [a]; const out=[]; a.forEach((x,k)=>perms(a.slice(0,k).concat(a.slice(k+1))).forEach(p=>out.push([x,...p]))); return out; }
function voice(root, ivs, bassI){
  const n=ivs.length; const w=placeShape(state.shape), anchor=(w.lo+w.hi)/2;
  const rest=ivs.slice(); rest.splice(rest.indexOf(bassI),1); const ps=perms(rest); let best=null;
  for(let s0=0;s0<=6-n;s0++) for(let lo=0;lo<=13;lo++) for(const pm of ps){ const order=[bassI,...pm]; const fr=[];
    let ok=true; for(let k=0;k<n&&ok;k++){ let f=null; for(let g=lo;g<=lo+4;g++) if((pc(s0+k,g)-root+12)%12===order[k]){f=g;break;} if(f===null) ok=false; else fr.push(f); }
    if(!ok) continue; const bm=BASEMIDI[s0]+fr[0]; if(fr.some((f,k)=>k>0&&BASEMIDI[s0+k]+f<=bm)) continue;
    const mn=Math.min(...fr), mx=Math.max(...fr); const cost=(mx-mn)*2+Math.abs((mn+mx)/2-anchor)+(s0>2?1.5:0);
    if(best===null||cost<best.cost) best={cost,s0,fr}; }

  const frets=[null,null,null,null,null,null]; best.fr.forEach((f,k)=>frets[best.s0+k]=f); return frets;

const EXTLBL={0:'R',1:'b9',2:'9',3:'b3',4:'3',5:'11',6:'#11',7:'5',8:'b13',9:'13',10:'b7',11:'7'};
function roleColour(lbl){ return lbl==='R'?'var(--root)':['3','b3','2','4'].includes(lbl)?'var(--third)':['5','b5','#5'].includes(lbl)?'var(--fifth)':['7','b7','maj7','bb7'].includes(lbl)?'var(--seventh)':null; }
function roleDot(root,lbls){ return (x,y,r,i)=>{ const l=lbls[i]??EXTLBL[i]; const c=roleColour(l);
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c||'var(--tone)'}"${c?'':' stroke="var(--ink)" stroke-width="2.5"'}/>`+
         `<text x="${x}" y="${y+r*0.36}" text-anchor="middle" font-size="${r*(state.labels==='note'?1.05:0.95)}" font-weight="600" fill="#fff">${state.labels==='note'?NOTES[(root+i)%12]:l}</text>`; }; }
function voiceBox(root,frets,lbls){
  const notes=frets.map((f,si)=>f===null?null:{s:si,f,i:(pc(si,f)-root+12)%12}).filter(Boolean);
  const lo=Math.min(...notes.map(n=>n.f)), hi=Math.max(lo+3,...notes.map(n=>n.f));
  return box(lo,hi,notes,new Set(frets.map((f,si)=>f===null?si:-1).filter(x=>x>=0)),roleDot(root,lbls));

// ---------- slash chords and bass lines ----------
function slashView(){
  const r=state.root, q=state.quality, nm=NOTES[r]+SUFFIX[q], tri=TRIAD[q], ch=CHORD[q];
  const base = q==='major'||q==='minor' ? tri : ch;
  const inv = base.slice(1).map((b,k)=>[b,['1st inversion — 3rd in the bass','2nd inversion — 5th in the bass','3rd inversion — 7th in the bass'][k]]);
  const non = (q==='major'||q==='maj7') ? [[11,'maj7 sound without moving the chord'],[10,'the dominant 7th, bass on the b7'],[2,'floats — a 9sus colour'],[9,'a 6th or a vi m7 in disguise']]
            : (q==='minor'||q==='min7') ? [[10,'m7, bass on the b7'],[11,'the line-cliché note (see below)'],[9,'m6 / Dorian colour'],[8,'VI maj7 in disguise']]
            : q==='dom7' ? [[2,'a 9 chord from the bass up'],[5,'the sus4 / 11 in the bass']] : [[2,'the 9th in the bass'],[5,'the 11th in the bass']];
  const card=(bassI,cap)=>{ const ivs=[...new Set([bassI,...base])]; const fr=voice(r,ivs,bassI); if(!fr) return '';
    const lbl={...( [10,11].includes(bassI)&&!ch.includes(bassI) ? {10:'b7',11:'7'} : {} ), 2:'2',5:'4',9:'6',8:'b6'}; if(ch.includes(9)) lbl[9]='6';
    return `<div class="triad">${voiceBox(r,fr,lbl)}<div class="cap"><b>${nm}/${NOTES[(r+bassI)%12]}</b><br><span style="font-size:12px">${cap}</span></div></div>`; };
  let h=`<h2><span>Slash chords <small>${nm} over different bass notes — chord/bass, the bass note lowest, nearest the ${state.pos==='open'?'open position':state.shape+' shape'}</small></span></h2>`;
  h+=`<div class="row">${inv.map(([b,c])=>card(b,c)).join('')}${non.map(([b,c])=>card(b,c)).join('')}</div>`;
  h+=`<p class="note">An inversion keeps the chord's own notes and just changes which one is lowest; a non-chord bass note (${nm}/${NOTES[(r+non[0][0])%12]}) changes what the ear hears the chord as. Both exist for one reason: to make the bass move in steps while the chord sits still.</p>`;
  // bass lines
  const minorMode=MINORISH.includes(q), mode=minorMode?'minor':'major', H=harmonise(r,mode), N=i=>NOTES[(r+i)%12];
  const C=(deg,bass,qq)=>{ const c=H[deg]; const qual=qq||c.q; return {root:c.root,q:qual,bass:bass===undefined?c.root:(r+bass)%12,name:NOTES[c.root]+SUFFIX[qual]+(bass===undefined?'':'/'+N(bass))}; };
  const lines = !minorMode ? [
      ['Descending — I – I/7 – vi – vi/5 – IV – I/3 – ii – V','the bass walks down the scale; the chords are the ones already in the key',[C(0),C(0,11),C(5),C(5,7),C(3),C(0,4),C(1),C(4)]],
      ['Ascending — I – I/3 – IV – #iv° – V','the #4 diminished is a passing chord between IV and V',[C(0),C(0,4),C(3),{root:(r+6)%12,q:'dim7',bass:(r+6)%12,name:N(6)+'°'},C(4)]],
      ['Pedal — I – IV/1 – V/1 – I','the bass stays on the root while the chords change above it',[C(0),C(3,0),C(4,0),C(0)]] ]
    : [ ['Descending — i – i/b7 – VI – V7','the classic minor walk-down; V7 borrows the raised 7th',[C(0),C(0,10),C(5),{root:(r+7)%12,q:'dom7',bass:(r+7)%12,name:N(7)+'7'}]],
        ['Line cliché — i – i/7 – i/b7 – i/6','one chord, the bass falls a half step at a time',[C(0),C(0,11),C(0,10),C(0,9)]],
        ['Ascending — i – III/5 – iv – V7','up through the 5th of III to iv, then home through V7',[C(0),C(2,7),C(3),{root:(r+7)%12,q:'dom7',bass:(r+7)%12,name:N(7)+'7'}]] ];
  const bassTab=chords=>{ let prev=null; const ev=[], marks=[];
    chords.forEach((c,k)=>{ let best=null; for(const st of [0,1]) for(let f=0;f<=15;f++) if(pc(st,f)===c.bass){ const d=prev===null?Math.abs(f-((r-4+12)%12)):Math.abs(f-prev.f)+(st!==prev.s?0.5:0); if(best===null||d<best.d) best={s:st,f,d}; }
      marks.push({at:k,name:c.name}); ev.push({s:best.s,f:best.f,ann:NOTES[c.bass]}); prev=best; });
    return tabSvg(ev,marks); };
  lines.forEach(([title,desc,chords])=>{ h+=`<h3>${title} <small style="font-weight:400;color:var(--muted)">· ${desc}</small></h3><div class="bl">${chords.map(c=>`<button data-root="${c.root}" data-q="${c.q}">${c.name}</button>`).join('')}</div><div class="tabwrap">${bassTab(chords)}</div>`; });
  h+=`<p class="note">Play the bass line alone first, one note per bar, then add the chord above it (the slash voicings above, or a triad on the top three strings). Click a chord to load it.</p>`;
  const el=document.getElementById('slash'); el.innerHTML=h;
  el.querySelectorAll('[data-root]').forEach(b=>b.addEventListener('click',()=>{ state.root=+b.dataset.root; state.quality=b.dataset.q; render(); }));
}

    else { if(cur&&cur.dur>=0.06) notes.push(cur); cur={midi:m,t:f.t,dur:0.04,cents:[(f.midi-m)*100]}; } }

const KS_MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88], KS_MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];

// notes of the pentatonic box for the current shape/position, for a given quality ('major' or 'minor'), ascending by pitch
function boxNotes(qual){
  const saved=state.quality; state.quality=qual; const {lo,hi}=placeShape(state.shape,'pent'); state.quality=saved;

// a run of `count` consecutive box notes that ends on a note of pitch class endPc; ascending or descending

  const seq = dir>0 ? notes : [...notes].reverse();

// ---------- double-stop hammer-ons: original exercise generated from the pentatonic box ----------
function dsView(){
  const q=state.quality, pent=PENTA[q]||PENTA.major, name=state.shape, r=state.root;
  const {lo,hi}=placeShape(name,'pent');
  const onStr=st=>{ const f=[]; for(let x=lo;x<=hi;x++) if(pent.includes(iv(st,x))) f.push(x); return f; };
  const cell=(L,U)=>{ const l=onStr(L), u=onStr(U); if(l.length<2||u.length<2) return [];
    return [ {notes:[{s:L,f:l[0]},{s:U,f:u[0]}]}, {notes:[{s:L,f:l[0]},{s:U,f:u[1]}],ann:'H'}, {notes:[{s:L,f:l[0]},{s:U,f:u[1]}]}, {notes:[{s:L,f:l[1]},{s:U,f:u[1]}],ann:'H'} ]; };
  const pairs=[[4,5],[3,4],[2,3],[1,2],[0,1]];
  const pairName=x=>NOTES[TUNING[x]]+(x===0?' (low)':x===5?' (high)':'');
  let ev=[], marks=[];
  if(state.dsMode==='box'){ for(const [L,U] of pairs){ marks.push({at:ev.length,name:`${NOTES[TUNING[U]]}+${NOTES[TUNING[L]]}`}); ev=ev.concat(cell(L,U)); } }
  else { const [L,U]=state.dsPair; ev=cell(L,U).concat(cell(L,U)); marks.push({at:0,name:`${pairName(U)} + ${pairName(L)}`}); }
  // chord version: I V IV I — on each chord, the double stop from the box whose notes are both chord tones, hammered into from the scale note below
  const maj=SCALE.major, degs=[[0,'I'],[4,'V'],[3,'IV'],[0,'I']];
  let cev=[], cmarks=[];
  for(const [d,rn] of degs){ const cr=(r+maj[d])%12, ct=CHORD.major.map(i=>(cr+i)%12), nm=NOTES[cr];
    let best=null;
    for(const [L,U] of pairs){ const l=onStr(L), u=onStr(U);
      for(const lf of l) for(const uf of u){ if(ct.includes(pc(L,lf)) && ct.includes(pc(U,uf))){ const ui=u.indexOf(uf); const from=ui>0?u[ui-1]:null; const score=(pc(U,uf)===cr?2:0)+(from!==null?1:0)+U; if(!best||score>best.score) best={L,U,lf,uf,from,score}; } } }
    if(!best) continue;
    cmarks.push({at:cev.length,name:nm+' ('+rn+')'});
    if(best.from!==null) cev.push({notes:[{s:best.L,f:best.lf},{s:best.U,f:best.from}]},{notes:[{s:best.L,f:best.lf},{s:best.U,f:best.uf}],ann:'H'});
    cev.push({notes:[{s:best.L,f:best.lf},{s:best.U,f:best.uf}]},{notes:[{s:best.L,f:best.lf},{s:best.U,f:best.uf}]});
  }

// ---------- progressions by mood, with a generated lick over each chord ----------
// written relative to C major / A minor: [root pc, quality]
const MOODS=[
  ['Sad',      [[9,'minor'],[0,'major'],[9,'minor'],[7,'major']], '6m – 1 – 6m – 5'],
  ['Neutral',  [[4,'minor'],[5,'major'],[0,'major'],[2,'minor']], '3m – 4 – 1 – 2m'],

  ['Dark',     [[5,'major'],[0,'major'],[9,'minor'],[4,'minor']], '4 – 1 – 6m – 3m'],
  ['Epic',     [[0,'major'],[7,'major'],[9,'minor'],[5,'major']], '1 – 5 – 6m – 4'],
  ['Spooky',   [[2,'minor'],[4,'major'],[2,'minor'],[0,'major']], '2m – 3 – 2m – 1  (the E major is borrowed from A harmonic minor)'],
  ['Heroic',   [[0,'major'],[8,'major'],[10,'major']],            '1 – b6 – b7  (borrowed from the parallel minor)'],

function moodView(extra){
  const r=state.root, [mname,chords,numerals]=MOODS[state.mood], minorMode=MINORISH.includes(state.quality);
  const {lo,hi}=placeShape(state.shape,'pent');
  const keyMaj=minorMode?(r+3)%12:r;   // the moods are written in C major / A minor: in a minor key the selected root is the relative minor
  const pent=PENTA.major.map(i=>(keyMaj+i)%12);
  const tr=chords.map(([cr,q])=>({root:(keyMaj+cr)%12,q,name:NOTES[(keyMaj+cr)%12]+SUFFIX[q]}));
  let ev=[], marks=[], dir=1;
  for(const c of tr){
    const ct=CHORD[c.q].map(i=>(c.root+i)%12), pool=new Set([...pent,...ct]);
    let notes=[]; for(let st=0;st<6;st++) for(let f=Math.max(0,lo-1);f<=hi+1;f++) if(pool.has(pc(st,f))) notes.push({s:st,f,p:BASE[st]+f});
    notes.sort((a,b)=>a.p-b.p||a.s-b.s); notes=notes.filter((n,j)=>j===0||n.p!==notes[j-1].p);
    if(notes.length<4) continue;

    const thirds=notes.filter(n=>pc(n.s,n.f)===ct[1]); if(!thirds.length) continue;
