  h+=`<div class="ctl" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 12px;padding:8px 10px;background:var(--panel);border-radius:8px"><span class="lbl">Length</span>${[20,40,60].map(n=>`<button data-sesslen="${n}" class="${SESSION.total===n?'on':''}">${n} min</button>`).join('')}<button data-sessnew="1" style="font-weight:700;margin-left:8px">\u21bb New session</button>${SESSION.blocks.length?`<button data-sessstart="1" style="font-weight:700;background:var(--fifth);border-color:var(--fifth);color:#fff;margin-left:4px">${inProg?'Restart from block 1':'\u25b6 Start'}</button>`:''}</div>`;
  if(!SESSION.blocks.length) h+=`<p class="note">Click <b>New session</b> to draw one.</p>`;
  else { h+=`<div class="form">${SESSION.blocks.map((b,k)=>`<div class="frow" style="align-items:center"><div class="fbar" style="flex:0 0 56px;font-weight:700">${b.mins} min</div><div class="fbar" style="flex:0 0 260px;text-align:left"><b>${k+1}. ${b.title}</b></div><div class="fbar" style="flex:1;text-align:left;color:var(--muted)">${b.why}</div><div class="fbar" style="flex:0 0 90px"><button data-sessgo="${k}">${SESSION.idx===k?'\u25cf here':'Go'}</button></div></div>`).join('')}</div>
    <p class="note">Start runs the timer and loads block 1; each block loads its routine, key and shape for you, and the bar at the bottom of the screen counts it down and moves on (with a tick) when time is up. Pause if you need to, or press Next. Go opens any block without the timer. Each New session draws different numbers, so nothing repeats; write down a number you like and use the go-to boxes to return to it.</p>`; }
  return h+`</div></div>`; }

// ---------- section tabs (one section visible at a time, no scrolling) ----------
const SECTIONS=[['shapes','Position',['grid']],['cowboy','Cowboy chords',['cowboy']],['triads','Triads & voicings',['triads','shells','drop2','ext','slash']],['numsys','Chord numbers',['numsys']],['modes','Modes',['modes']],['intervals','Scale in intervals',['dyads','seq']],['practice','Practice',['practice']],['listen','Listen',['listen']],['metro','Metronome',['metro']],['study','Study a piece',['study']]];
function sectionsView(){
  const nav=document.getElementById('sections');
  nav.innerHTML=SECTIONS.map(([id,nm])=>`<button data-sec="${id}" class="${state.section===id?'on':''}">${nm}</button>`).join('')+`<button data-neck="1" class="necktoggle">${state.neckHidden?'Show neck':'Hide neck'}</button>`;
  nav.querySelector('[data-neck]').addEventListener('click',()=>{state.neckHidden=!state.neckHidden;sectionsView();});
  document.getElementById('neck').classList.toggle('sec-hidden',state.neckHidden);
  nav.querySelectorAll('button[data-sec]').forEach(b=>b.addEventListener('click',()=>{state.section=b.dataset.sec;sectionsView();}));
  const show=new Set(SECTIONS.find(x=>x[0]===state.section)[2]);
  for(const [, , ids] of SECTIONS) for(const id of ids){ const el=document.getElementById(id); if(el) el.classList.toggle('sec-hidden',!show.has(id)); }
  const sh=document.getElementById('shapes'); sh.classList.toggle('sec-hidden', !['shapes','triads','intervals','practice'].includes(state.section));
  const dy=document.getElementById('dyads'); if(dy) dy.classList.toggle('sec-hidden', !(state.section==='intervals' && state.seqRange==='pair'));
}

// ---------- magnifier: a round lens that follows the mouse anywhere on the page and shows what's underneath enlarged ----------
(function(){
  const lens=document.createElement('div'); lens.id='loupe';
  lens.style.cssText='position:fixed;width:260px;height:260px;border-radius:50%;overflow:hidden;pointer-events:none;z-index:9999;display:none;border:3px solid var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.28);background:var(--paper)';
  document.body.appendChild(lens);
  const R=130, TARGET=1.9, ZOOM=2;   // lens radius; small drawings are shown at 1.9x their natural size, everything else at 2x
  let src=null, clone=null, zoom=1, stale=false, mo=null;
  const scaleOf=svg=>{ const vb=svg.viewBox&&svg.viewBox.baseVal, r=svg.getBoundingClientRect(); return (vb&&vb.width)?r.width/vb.width:1; };
  const btn=document.getElementById('magBtn'), sync=()=>{ if(btn) btn.classList.toggle('on',!!state.magnifier); };
  if(btn) btn.addEventListener('click',()=>{ state.magnifier=!state.magnifier; sync(); hide(); saveSettings(); });
  sync();
  function hide(){ lens.style.display='none'; if(clone) clone.remove(); clone=null; src=null; if(mo){ mo.disconnect(); mo=null; } }
  // what to copy into the lens: a small drawing on its own (sharper), otherwise the nearest sizeable block of the page around the pointer
  function pick(t){
    if(state.studyOverlay&&t.closest&&t.closest('#stPage')) return null;   // the shape overlay has the page
    const svg=t.closest&&t.closest('svg'); if(svg&&svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.width&&scaleOf(svg)<0.95) return {el:svg,svg:true};
    let el=t; while(el&&el!==document.body){ const r=el.getBoundingClientRect(); if(r.width>=320&&r.height>=60) break; el=el.parentElement; }
    if(!el||el===document.body||el===document.documentElement) return null;
    // keep the copy a manageable size: step down from a very tall block to the child under the pointer
    while(el.getBoundingClientRect().height>1400){ const kid=[...el.children].find(k=>k.contains(t)); if(!kid) break; el=kid; }
    return {el,svg:false}; }
  function build(p){
    const r=p.el.getBoundingClientRect(); hide(); src=p.el; stale=false;
    if(p.svg){ zoom=Math.min(5,Math.max(1.8,TARGET/scaleOf(p.el))); clone=p.el.cloneNode(true); clone.removeAttribute('width'); clone.style.cssText=`position:absolute;max-width:none;width:${r.width*zoom}px;height:${r.height*zoom}px`; }
    else { zoom=ZOOM; const c=p.el.cloneNode(true); c.style.margin='0'; c.style.width=r.width+'px'; c.style.boxSizing='border-box';
      clone=document.createElement('div'); clone.style.cssText=`position:absolute;width:${r.width}px;transform:scale(${zoom});transform-origin:0 0`;
      // rebuild the block's ancestors around the copy (same ids and classes, but laid flat), so the page's styles that depend on where the block sits
      // - sizes, fonts, colours - still apply and the copy lines up exactly with what's under the pointer
      let holder=clone; const chain=[]; for(let a=p.el.parentElement; a&&a!==document.body&&a!==document.documentElement; a=a.parentElement) chain.unshift(a);
      for(const a of chain){ const sh=a.cloneNode(false); sh.style.cssText+=';display:block;position:static;margin:0;padding:0;border:0;width:auto;height:auto;min-height:0;max-width:none;max-height:none;overflow:visible;transform:none;box-shadow:none;background:transparent'; holder.appendChild(sh); holder=sh; }
      holder.appendChild(c);
      // copy what the user has typed or chosen, which cloning doesn't carry over
      const a=p.el.querySelectorAll('input,select,textarea'), b=c.querySelectorAll('input,select,textarea'); a.forEach((x,i)=>{ if(b[i]) b[i].value=x.value; });
      const ca=p.el.querySelectorAll('canvas'), cb=c.querySelectorAll('canvas'); ca.forEach((x,i)=>{ if(!cb[i]) return; cb[i].width=x.width; cb[i].height=x.height; try{ cb[i].getContext('2d').drawImage(x,0,0); }catch(e){} }); }
    lens.appendChild(clone); lens.style.display='block';
    // if the page changes underneath (a playback highlight, a new draw), refresh the copy on the next move
    mo=new MutationObserver(()=>{ stale=true; }); mo.observe(p.el,{subtree:true,childList:true,attributes:true,characterData:true}); }
  document.addEventListener('mousemove',e=>{
    if(!state.magnifier||e.target===lens){ if(src) hide(); return; }
    const p=pick(e.target); if(!p){ if(src) hide(); return; }
    if(p.el!==src||stale||!src.isConnected) build(p);
    const r=src.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    clone.style.left=(R-x*zoom)+'px'; clone.style.top=(R-y*zoom)+'px';
    // sit just above and to the right of the pointer, kept on screen
    let lx=e.clientX+18, ly=e.clientY-2*R-18; if(lx+2*R>innerWidth-6) lx=e.clientX-2*R-18; if(ly<6) ly=e.clientY+24;
    lens.style.left=lx+'px'; lens.style.top=ly+'px'; });
  document.addEventListener('mouseleave',hide); window.addEventListener('scroll',()=>{ if(src) lens.style.display='none'; },{passive:true});
  document.addEventListener('keydown',e=>{ if((e.key==='m'||e.key==='M')&&!e.target.matches('input,select,textarea')&&!e.metaKey&&!e.ctrlKey){ state.magnifier=!state.magnifier; sync(); hide(); saveSettings(); } });
  window.loupeHide=hide;
})();

function savePopHist(){ try{ localStorage.setItem('caged-popHist',JSON.stringify(state.popHist)); localStorage.setItem('caged-popHistIdx',String(state.popHistIdx)); }catch(e){} }
// ---------- chord numbers everywhere: any Roman numeral in the page text is shown in the number system (I \u2192 1, ii \u2192 2m, V7 \u2192 5\u2077, ii\u00f8 \u2192 2\u00f8, bVII \u2192 b7) ----------
const RN_VAL={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7};
const RN_RX=/(^|[^A-Za-z0-9])([b#]?)(VII|VI|IV|V|III|II|I|vii|vi|iv|v|iii|ii|i)( ?maj7| ?m7b5| ?m7|7|\u00f87|\u00f8|\u00b07|\u00b0)?(?![A-Za-z0-9\u2019'])/g;
function romanToNum(txt){ return txt.replace(RN_RX,(m,pre,acc,rn,suf,off,str)=>{ const at=off+pre.length, end=at+acc.length+rn.length+(suf||'').length, before=str.slice(0,at), after=str.slice(end);
    if(rn==='i'&&(/^[\u2013-][mac]/.test(after)||/[pma][\u2013-]$/.test(before)||/^\.[a-z]/.test(after))) return m;   // finger names p\u2013i\u2013m\u2013a and 'i.e.'
    if(rn==='I'&&/^ (am|have|will|would|think|can|do|use|like|recommend|suggest)\b/.test(after)) return m;          // the word I
    if(rn==='v'&&/^\.?\s*\d/.test(after)) return m;
    const low=rn===rn.toLowerCase(), sf=(suf||'').trim();
    // a major chord on the 3rd, 6th or 7th (III, VI, VII, not their 7th-chord secondary dominants) only occurs as the minor key's b3, b6, b7
    const flat=!acc&&!low&&['III','VI','VII'].includes(rn)&&sf!=='7'; let out=(flat?'b':acc)+RN_VAL[rn.toLowerCase()];
    if(sf==='\u00b0'||sf==='\u00b07'||sf==='\u00f8'||sf==='\u00f87') out+=sf; else if(sf==='maj7') out+=(low?'m':'')+'maj7'; else if(sf==='m7b5') out+='m7b5'; else if(sf==='m7') out+='m7';
    else if(sf==='7') out+=low?'m7':'\u2077'; else if(low) out+='m';
    return pre+out; }); }
function numeralsToNumbers(root){ const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentNode; return p&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
  const list=[]; while(w.nextNode()) list.push(w.currentNode); for(const n of list){ const t=n.nodeValue; if(!/[IVXiv]/.test(t)) continue; const u=romanToNum(t); if(u!==t) n.nodeValue=u; }
  if(root.querySelectorAll) root.querySelectorAll('[title]').forEach(e=>{ const t=e.getAttribute('title'), u=romanToNum(t); if(u!==t) e.setAttribute('title',u); }); }
// anything added to the page later (render, the session bar, quiz answers) is converted as it appears
new MutationObserver(ms=>{ for(const m of ms) for(const n of m.addedNodes){ if(!n.isConnected) continue; if(n.nodeType===1&&!/^(SCRIPT|STYLE)$/.test(n.nodeName)) numeralsToNumbers(n); else if(n.nodeType===3){ const u=romanToNum(n.nodeValue); if(u!==n.nodeValue) n.nodeValue=u; } } }).observe(document.body,{childList:true,subtree:true});
numeralsToNumbers(document.body);
function render(){ PLAYER.reg=[]; stopPlayback(); saveSettings();
  const q=state.quality, rootName=NOTES[state.root];

    document.querySelectorAll('#roots button').forEach(b=>{ const r=+b.dataset.r; b.classList.toggle('on',r===state.root); b.classList.toggle('rel',r===rel&&r!==state.root);
      b.title = r===rel ? (minorish?`relative major of ${NOTES[state.root]}m`:`relative minor of ${NOTES[state.root]}: ${NOTES[rel]}m`) : `relative minor: ${NOTES[(r+9)%12]}m`; }); }
  document.querySelectorAll('#quality button').forEach(b=>b.classList.toggle('on',b.dataset.q===q));

    // the chord's scale, spelled out with chord tones in their colours (root red, 3rd yellow, 5th green, 7th purple)
    (()=>{ const DEG={0:'1',1:'b2',2:'2',3:'b3',4:'3',5:'4',6:'b5',7:'5',8:'b6',9:'6',10:'b7',11:'7'}, ct=CHORD[q], nm=SCALENAME[q];

  document.querySelectorAll('#pos button').forEach(b=>b.classList.toggle('on',b.dataset.p===state.pos));

  let cards = `
    <div class="card"><h2>Chord <small>${state.pos==='open'?'open voicing':state.shape+' shape voicing'}</small></h2>${chordView(state.shape)}

      <div class="formula">${ct.join(' ')}</div></div>`;
  if(PENTA[q]) cards += `
    <div class="card tall"><h2>Pentatonic <small>${PENTA[q]===PENTA.major?'major':'minor'} pentatonic</small></h2>${scaleView(state.shape,PENTA[q],'pent',state.shapeLinks)}
      <div class="formula">${PENTA[q].map(i=>NOTES[(state.root+i)%12]).join(' ')}</div></div>`;
  cards += `
    <div class="card tall"><h2>Scale <small>${scaleName}</small></h2>${scaleView(state.shape,SCALE[q],undefined,state.shapeLinks)}

  // the shape's own triads: root, 3rd and 5th only, every close grip that sits inside this position

  { const pt=posTriads(state.shape), where=open?'open position':state.shape+' shape', seventh=CHORD[q].length===4;
    if(pt.length) triCards = `<div class="postri n${pt.length}">${pt.map(t=>`<div class="card tri" title="Solid dots: the ${t.nm} triad on the ${t.strings} strings. Faded dots: the rest of the ${rootName}${suffix} ${where} chord${seventh?' \u2014 the 7th is left out of the triad':''}."><h2>${t.nm} triad <small>${t.strings} strings</small></h2>${t.svg}

  document.querySelectorAll('#grid [data-shapelinks]').forEach(b=>b.addEventListener('click',()=>{ state.shapeLinks=!state.shapeLinks; render(); }));

    const chips=ORDER.map(n=>{ const offs=SHAPES[n][state.quality]; if(!offs) return ''; const ps=placeShape(n); const played=offs.map((o,st)=>o===null?null:{st,f:o+ps.r6}).filter(Boolean); const cnt=played.length;

  let trHtml = `<p class="plegend"><span class="gdot"></span><span>Faded dashed dots = the ${parWhere} the voicing comes from \u00b7 solid dots = the notes you play. Change shape with the buttons above to see the same triads re-drawn against a different parent.</span></p>`;
  // with a 7th chord selected the rootless voicings (3rd, 5th and 7th) lead: they are the ones that actually sound like the chosen chord; the plain triad follows
  const triBlock = lead => `<h2${lead?'':' style="margin-top:14px"'}>Triads <small>close-voiced, within reach of this position${hasSeventh?' \u00b7 7th omitted \u2014 the underlying '+NOTES[state.root]+(ch4[2]===6?'\u00b0':ch4[1]===4?'':'m')+' triad':''}</small></h2>`+
    `<div class="row">${lead?parCard:''}${trCards(tr)}</div>`;
  if(hasSeventh){
    const up = ch4.slice(1), ur = (state.root+up[0])%12, d1 = up[1]-up[0], d2 = up[2]-up[0];
    const uq = (d1===4&&d2===7)?'':(d1===3&&d2===7)?'m':(d1===3&&d2===6)?'\u00b0':(d1===4&&d2===8)?'+':'?';
    const ut = triadView(state.shape, up), degs = up.map(i=>INTV[state.quality][i]).join('\u2013');
    trHtml += `<h2>Rootless ${NOTES[state.root]}${SUFFIX[state.quality]} <small>${degs} without the root \u2014 a ${NOTES[ur]}${uq} triad over ${NOTES[state.root]}${SUFFIX[state.quality]}; let the bass supply the root</small></h2>`+
      `<div class="row">${parCard}${trCards(ut)}</div>`+triBlock(false);
  } else trHtml += triBlock(true);
  document.getElementById('triads').innerHTML = (trPrefix||'')+trHtml;
  document.querySelectorAll('#triads [data-trishape]').forEach(b=>b.addEventListener('click',()=>{ state.shape=b.dataset.trishape; if(state.pos==='open') state.pos='caged'; render(); }));
  const d2 = drop2View(state.shape); let el=document.getElementById('drop2');
  if(d2.length){ if(!el){ el=document.createElement('div'); el.className='drop2'; el.id='drop2'; document.getElementById('triads').after(el); }
    el.innerHTML=`<h2>Four-note voicings <small>drop-2 style, one chord tone per string, within reach of this position</small></h2><div class="row">${d2.map(x=>`<div class="triad${x.shared===4?' fromparent':''}">${x.svg}<div class="cap">${x.cap}</div></div>`).join('')}</div>`;
  } else if(el) el.remove();
  shellsView();
  extView();
  slashView();
  numsysView();
  modesView();
  listenView(); metroView(); studyView();
  dyadsView();
  seqView();
  cowboyView();
  practiceView();
  sectionsView();
}
// convert straight after each render as well, so the page never shows a Roman numeral even for an instant
{ const _render=render; render=function(){ _render(); numeralsToNumbers(document.body); }; }

// ---------- controls ----------
const rootsEl=document.getElementById('roots');
NOTES_SHARP.forEach((n,i)=>{ const b=document.createElement('button'); b.innerHTML=`${n===NOTES_FLAT[i]?n:n+'/'+NOTES_FLAT[i]}<small>${NOTES_SHARP[(i+9)%12]}m</small>`; b.dataset.r=i; b.addEventListener('click',()=>{state.root=i;state.key=i;render();}); rootsEl.appendChild(b); });
document.querySelectorAll('#quality button').forEach(b=>b.addEventListener('click',()=>{state.quality=b.dataset.q;state.keyMode=MINORISH.includes(state.quality)?'minor':'major';render();}));
document.querySelectorAll('#labels button').forEach(b=>b.addEventListener('click',()=>{state.labels=b.dataset.l;render();}));
document.querySelectorAll('#pos button').forEach(b=>b.addEventListener('click',()=>{state.pos=b.dataset.p;render();}));
document.querySelectorAll('#register button').forEach(b=>b.addEventListener('click',()=>{state.register=b.dataset.reg;render();}));
render();
</script>
</body>
